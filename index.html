// ── DERIVED STATE (everything computed fresh from rows; nothing cached) ─────
// Idempotent totals: each SegmentId counts once, a clean row wins over a recovered one.
function dedupe(rows){
  const m = new Map();
  rows.forEach(r => { const p = m.get(r.SegmentId); if(!p || (p.Closure==='recovered' && r.Closure==='clean')) m.set(r.SegmentId, r); });
  return Array.from(m.values());
}
const LONG_LIMIT = {module:3600, quiz:2400, final:5400};
function computeUser(email){
  const all = dedupe(ROWS.filter(r => r.StaffId === email)).sort((a,b) => a.StartTime < b.StartTime ? -1 : a.StartTime > b.StartTime ? 1 : 0);
  const timed = all.filter(r => r.Type==='module' || r.Type==='quiz' || r.Type==='final');
  const done = new Set(all.filter(r => (r.Type==='module' || r.Type==='quiz') && r.Status==='completed').map(r => r.Module));
  const finals = all.filter(r => r.Type==='final' && (r.Status==='passed' || r.Status==='failed'));
  const grants = all.filter(r => r.Type==='grant').reduce((s,r) => s + (Number(r.Score)||0), 0);
  const passedRow = finals.find(r => r.Status === 'passed');
  const allowance = FINAL_MAX_ATTEMPTS + grants;
  const doneCount = ATLAS_MODULES.filter(m => done.has(m.id)).length;
  const allDone = doneCount === ATLAS_MODULES.length;
  const certified = allDone && !!passedRow;
  const locked = allDone && !passedRow && finals.length >= allowance;
  let status = 'not_started';
  if(timed.length || doneCount) status = 'in_progress';
  if(allDone && !certified) status = locked ? 'locked' : 'awaiting_final';
  if(certified) status = 'certified';
  const sum = (arr, f) => arr.reduce((s,r) => s + (Number(r[f])||0), 0);
  const initialT = sum(timed.filter(r => r.VisitType==='initial' && r.Type!=='final'), 'Duration_s');
  const reviewT = sum(timed.filter(r => r.VisitType==='review'), 'Duration_s');
  const finalT = sum(timed.filter(r => r.Type==='final'), 'Duration_s');
  const idleT = sum(timed, 'IdleSeconds');
  const activeT = sum(timed, 'Duration_s');
  const flagsByRow = {};
  timed.forEach(r => { flagsByRow[r.SegmentId] = rowFlags(r, timed); });
  const flagCount = Object.values(flagsByRow).reduce((s,f) => s + f.length, 0);
  const per = {};
  ATLAS_MODULES.forEach(m => { per[m.id] = {readI:0, checkI:0, review:0, attempts:0}; });
  timed.forEach(r => {
    const p = per[r.Module]; if(!p) return;
    if(r.VisitType === 'review') p.review += Number(r.Duration_s)||0;
    else if(r.Type === 'quiz') p.checkI += Number(r.Duration_s)||0;
    else p.readI += Number(r.Duration_s)||0;
    if(r.Type === 'quiz') p.attempts++;
  });
  const paidT = initialT + finalT + (SETTINGS.reviewPaid ? reviewT : 0);
  return {email, all, timed, done, finals, grants, allowance, used:finals.length, passedRow, doneCount, allDone, certified, locked, status,
          initialT, reviewT, finalT, idleT, activeT, paidT, flagsByRow, flagCount, per};
}
function rowFlags(r, timed){
  const f = [];
  if(r.Closure === 'recovered') f.push('recovered');
  const s = new Date(r.StartTime).getTime(), e = new Date(r.EndTime).getTime(), rc = new Date(r.ReceivedTime).getTime();
  if(!isNaN(rc) && !isNaN(e) && Math.abs(rc - e) > 10*60e3) f.push('clock mismatch');
  else if(!isNaN(s) && !isNaN(e) && (e - s)/1000 + 5 < (Number(r.Duration_s)||0)) f.push('clock mismatch');
  if((Number(r.Duration_s)||0) > (LONG_LIMIT[r.Type]||1e9)) f.push('unusually long');
  const overlap = timed.some(o => o.SegmentId !== r.SegmentId && new Date(o.StartTime).getTime() < e - 5000 && new Date(o.EndTime).getTime() > s + 5000);
  if(overlap) f.push('overlapping');
  return f;
}
function isDone(id){ return computeUser(ME.email).done.has(id); }
function moduleUnlocked(i){ return i === 0 || isDone(ATLAS_MODULES[i-1].id); }
function nextAttempt(email, module, type){
  return dedupe(ROWS.filter(r => r.StaffId===email && r.Module===module && r.Type===type)).length + 1;
}

// ── CLOCK (active-time tracking, spec v2: timer, activity, prompt, heartbeat, checkpoint, recovery, one clock) ──
const Clock = {
  seg:null, state:'idle', live:false, quiet:0, promptSecs:0, pending:0, nextBeat:0, hbCount:0, timer:null,
  init(){
    if(this.timer) return;
    this.timer = setInterval(() => this.tick(), 1000);
    ['pointerdown','keydown','scroll','touchstart','wheel'].forEach(ev => window.addEventListener(ev, () => this.activity(), {passive:true, capture:true}));
    document.addEventListener('visibilitychange', () => { if(document.hidden) this.checkpoint(false); });
    window.addEventListener('pagehide', () => this.checkpoint(true));
  },
  acquire(){
    try{
      const raw = localStorage.getItem(LOCK_KEY), l = raw ? JSON.parse(raw) : null, now = Date.now();
      if(l && l.sid !== SESSION_ID && now - l.ts < LOCK_TTL) return false;
      localStorage.setItem(LOCK_KEY, JSON.stringify({sid:SESSION_ID, email:ME?ME.email:'', ts:now}));
      return true;
    }catch(e){ return true; }
  },
  release(){ try{ const l = JSON.parse(localStorage.getItem(LOCK_KEY)||'null'); if(l && l.sid === SESSION_ID) localStorage.removeItem(LOCK_KEY); }catch(e){} },
  liveRec(closing){
    const s = this.seg;
    return {SegmentId:s.segId, StaffId:s.staffId, Module:s.module, Type:s.type, Attempt:s.attempt, VisitType:s.visit, StartTime:s.startTime,
      SessionId:SESSION_ID, Active:Math.max(0, s.active - (this.state==='prompt' ? this.pending : 0)), Idle:s.idle,
      hbAt:Date.now(), Paused:this.state==='paused', Closing:!!closing};
  },
  async start(spec){
    if(this.seg) await this.stop('left');
    const now = Date.now();
    this.seg = {segId:uid('seg-'), staffId:ME.email, module:spec.module, type:spec.type, attempt:spec.attempt, visit:spec.visit,
      startTime:iso(now), startMs:now, active:0, idle:0};
    this.quiet = 0; this.pending = 0; this.promptSecs = 0; this.hbCount = 0;
    this.nextBeat = Math.round(CFG.hb * (0.4 + Math.random()*0.6));   // jittered first checkpoint
    if(this.acquire()){ this.state = 'running'; this.live = true; Store.startSegment(this.liveRec(false)).catch(()=>{}); }
    else { this.state = 'blocked'; this.live = false; }
    this.paint();
  },
  activity(){
    if(!this.seg) return;
    if(this.state === 'prompt') this.confirm();
    else if(this.state === 'paused') this.resume();
    else if(this.state === 'running') this.quiet = 0;
  },
  confirm(){            // "I'm still here": the quiet time counts (reading)
    this.quiet = 0; this.pending = 0; this.promptSecs = 0; this.state = 'running'; hidePrompt(); this.paint();
  },
  resume(){             // activity after a pause
    if(!this.acquire()){ this.state = 'blocked'; this.paint(); return; }
    this.quiet = 0; this.pending = 0; this.state = 'running'; this.paint(); this.beat(false);
  },
  tick(){
    const s = this.seg; if(!s) return;
    if(this.state === 'blocked'){
      if(this.acquire()){ this.state = 'running'; this.live = true; s.startTime = iso(Date.now()); Store.startSegment(this.liveRec(false)).catch(()=>{}); }
      this.paint(); return;
    }
    if(this.live) this.acquire();                  // refresh the one-clock lock
    if(document.hidden){ updateDemoLive(); return; }   // hidden or minimized = not active
    if(this.state === 'running'){
      s.active++; this.quiet++;
      if(this.quiet >= CFG.idleAfter){ this.state = 'prompt'; this.promptSecs = 0; this.pending = this.quiet; showPrompt(); }
    } else if(this.state === 'prompt'){
      s.active++; this.promptSecs++; this.pending++;
      const el = document.getElementById('promptCount'); if(el) el.textContent = Math.max(0, CFG.promptWait - this.promptSecs);
      if(this.promptSecs >= CFG.promptWait){
        // no answer: the quiet time (since the last activity) becomes idle, and the clock pauses
        s.active = Math.max(0, s.active - this.pending); s.idle += this.pending; this.pending = 0;
        this.state = 'paused'; hidePrompt(); this.beat(false);
        toast('Timer paused: no activity. It resumes when you do something.');
      }
    }
    if((this.state === 'running' || this.state === 'prompt') && s.active >= this.nextBeat){
      this.beat(false); this.nextBeat = s.active + CFG.hb;
    }
    this.paint();
  },
  beat(closing){ if(!this.seg || !this.live) return; Store.heartbeat(this.liveRec(closing)).catch(()=>{}); this.hbCount++; },
  checkpoint(closing){ if(this.seg && this.live && this.state !== 'blocked') this.beat(closing); },
  shown(){ const s = this.seg; if(!s) return 0; return Math.max(0, s.active - (this.state==='prompt' ? this.pending : 0)); },
  paint(){
    const el = document.getElementById('clockChip');
    if(el){
      const s = this.seg;
      if(!s){ el.style.display = 'none'; }
      else {
        el.style.display = '';
        let cls = 'chip', txt = '';
        if(this.state === 'paused'){ cls += ' paused'; txt = 'Paused (idle) ' + fmtClock(this.shown()); }
        else if(this.state === 'blocked'){ cls += ' blocked'; txt = 'Not timing: Atlas is open in another tab'; }
        else txt = 'Active ' + fmtClock(this.shown());
        el.className = cls; el.innerHTML = '<span class="cd"></span>' + txt;
      }
    }
    updateDemoLive();
  },
  async stop(status, score){
    const s = this.seg; if(!s) return null;
    const wasLive = this.live;
    this.seg = null; this.state = 'idle'; this.live = false; hidePrompt(); this.release();
    if(!wasLive){ this.paint(); return null; }   // never held the clock: nothing to record
    const row = mkRow({email:s.staffId, module:s.module, type:s.type, attempt:s.attempt, score:(score==null?'':score), dur:s.active, idle:s.idle,
      start:s.startTime, end:iso(Date.now()), seg:s.segId, visit:s.visit, status, closure:'clean'});
    try{ await Store.endSegment(row); }
    catch(e){ outboxPush(row); toast('Save failed: held on this device and re-sent next time.'); }
    ROWS = await Store.fetchProgress();
    this.paint();
    return row;
  },
  // Demo only: simulate the browser closing mid-segment. withCheckpoint=true is the normal close (one last checkpoint is sent);
  // false is a crash or power loss (only the last periodic checkpoint exists).
  simulateClose(withCheckpoint){
    if(!this.seg || !this.live) return false;
    if(withCheckpoint) this.beat(true); else Store.markAbandoned(this.seg.segId);
    this.seg = null; this.state = 'idle'; this.live = false; hidePrompt(); this.release();
    SESSION_ID = uid('s-');
    return true;
  }
};
</script>
<script>
// ── LOGO (custom, nods to the project name: Atlas, the figure who carries the world; globe + meridians + compass star) ──
function logoSvg(px){

   + '<circle cx="14" cy="14" r="9" stroke="white" stroke-width="1.6"/>'

   + '<path d="M5 14h18M6.2 9.5h15.6M6.2 18.5h15.6" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>'
   + '<path d="M22.6 1.2l1.25 3.05 3.05 1.25-3.05 1.25-1.25 3.05-1.25-3.05-3.05-1.25 3.05-1.25z" fill="white"/></svg>';
}

// ── TOAST / MODALS / PROMPT HOSTS ────────────────────────────────────────────
function toast(m){
  const t = document.getElementById('toast'); if(!t) return;
  t.textContent = m; t.classList.add('show');
  clearTimeout(window._tt); window._tt = setTimeout(() => t.classList.remove('show'), 3200);
}
function host(id){ let h = document.getElementById(id); if(!h){ h = document.createElement('div'); h.id = id; document.body.appendChild(h); } return h; }
function openModal(inner){ document.getElementById('overlays').innerHTML = '<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">' + inner + '</div></div>'; }
function closeModal(){ document.getElementById('overlays').innerHTML = ''; }
function askConfirm(title, text, yes){
  return new Promise(resolve => {
    window._cfm = ok => { closeModal(); resolve(ok); };
    openModal('<h3>' + esc(title) + '</h3><p>' + esc(text) + '</p><div class="m-actions"><button class="btn btn-ghost" onclick="_cfm(false)">Cancel</button><button class="btn btn-primary" onclick="_cfm(true)">' + esc(yes||'Confirm') + '</button></div>');
  });
}
function showPrompt(){
  host('promptHost').innerHTML = '<div class="overlay" style="z-index:1100"><div class="modal" style="text-align:center"><h3>Still there?</h3><p>You have been quiet for a while. Confirm you are still working on this, or the timer will pause in <strong id="promptCount">' + CFG.promptWait + '</strong>s.</p><div class="m-actions" style="justify-content:center"><button class="btn btn-primary" id="stillHere" onclick="Clock.confirm()">I am still here</button></div></div></div>';
}
function hidePrompt(){ const h = document.getElementById('promptHost'); if(h) h.innerHTML = ''; }

// ── LOGIN ────────────────────────────────────────────────────────────────────
function fabHtml(){ return '<button class="demo-fab" onclick="openDemo()" title="Demo controls"><span>&#9881;</span><span class="lbl">Demo controls</span></button>'; }
function demoBar(){ return '<div class="demo-bar"><span class="dd"></span><span><strong>Demo data.</strong> Nothing is saved to a server.</span><span class="muted">' + APP_VERSION + '</span></div>'; }
function renderLogin(){
  document.getElementById('app').innerHTML = demoBar() + '<div id="login"><div class="entry-card">'
    + '<div class="brand-mark">' + logoSvg(30) + '</div>'
    + '<div class="eyebrow">CENTIFIC &middot; PROJECT ATLAS</div>'
    + '<div class="entry-title">Moderator Onboarding</div>'
    + '<div class="entry-sub">Training and certification for Project Atlas moderators.</div>'
    + '<label class="field-label" for="emailField">Centific email</label>'
    + '<input class="field-input" id="emailField" type="email" autocomplete="off" placeholder="name@centific.com" onkeydown="if(event.key===\'Enter\')doLogin()">'
    + '<div class="err-msg" id="lgErr"></div>'
    + '<button class="btn btn-primary" style="margin-top:6px" onclick="doLogin()">Continue &rarr;</button>'
    + '<div class="hint-line">Demo accounts: <strong>test.mod@centific.com</strong> (moderator), <strong>test.admin@centific.com</strong> (admin).</div>'
    + '<div class="version-tag">' + APP_VERSION + '</div></div></div>' + fabHtml();
}
function findUser(email){ return DIR.find(r => r.email === email.toLowerCase()); }
async function doLogin(){
  const el = document.getElementById('emailField');
  const email = (el.value || '').trim().toLowerCase();
  const err = document.getElementById('lgErr');
  // @centific.com check comes BEFORE any directory lookup
  if(!/^[^@\s]+@centific\.com$/.test(email)){ err.textContent = 'Please enter your @centific.com email address.'; return; }
  err.textContent = '';
  await refreshAll();
  const rec = findUser(email);
  if(!rec || rec.active === 'no'){ err.textContent = "That email isn't on the moderator list yet. Check with your project coordinator."; return; }
  ME = {email:rec.email, name:rec.name, role:rec.role, cohort:rec.cohort};
  const recovered = await Store.recoverOwn(ME.email, SESSION_ID);   // close abandoned segments from the last visit
  const resent = await flushOutbox();
  await refreshAll();
  startApp(rec.role);
  if(recovered) toast('Recovered ' + recovered + ' unfinished segment' + (recovered>1?'s':'') + ' from your last visit.');
  else if(resent) toast('Re-sent ' + resent + ' held save' + (resent>1?'s':'') + '.');
}
async function logout(){
  if(!(await safeLeave())) return;
  ME = null; ROLE = null; closeModal(); renderLogin();
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const nx = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', nx);
  try{ localStorage.setItem('atlas_theme', nx); }catch(e){}
}

// ── SHELL ────────────────────────────────────────────────────────────────────
function startApp(role){
  ROLE = role; VIEW = role === 'admin' ? 'dash' : 'path'; QZ = freshQZ(); FIN = {mode:'idle', idx:0, ans:{}, result:null};
  document.getElementById('app').innerHTML = demoBar() + '<div class="shell"><div class="page-wrap">'
    + '<div class="app-header"><div class="nav-left"><div class="nav-logo">' + logoSvg(18) + '</div>'
    + '<div class="nav-brand">Project <strong style="color:var(--accent-ink);font-weight:600">Atlas</strong> <span>&middot; Onboarding</span></div></div>'
    + '<div class="nav-right"><div class="who-text"><span>' + esc(ME.name) + '</span><br><span class="role-line">' + (role==='admin' ? 'Admin' : 'Moderator') + '</span></div>'
    + '<button class="icon-btn" onclick="toggleTheme()" title="Theme" aria-label="Toggle theme">&#9680;</button>'
    + '<button class="btn-signout" onclick="logout()"><span aria-hidden="true">&#9099;</span>Sign out</button></div></div>'
    + '<div class="nav-tabs" id="navTabs"></div><main class="content" id="content"></main></div></div>' + fabHtml();
  renderNavTabs(); renderView();
}
function renderNavTabs(){
  const tabs = ROLE === 'admin'
    ? [['dash','Dashboard'],['curriculum','Curriculum'],['mods','Moderators'],['mileage','Mileage']]
    : [['path','Learning Path'],['resources','Resources'],['mileage','Mileage']];
  const active = (VIEW==='module'||VIEW==='final') ? 'path' : (VIEW==='detail' ? 'mods' : VIEW);
  document.getElementById('navTabs').innerHTML = tabs.map(t => '<button class="nav-tab' + (active===t[0]?' active':'') + '" onclick="switchView(\'' + t[0] + '\')">' + t[1] + '</button>').join('');
}
async function switchView(v){
  if(!(await safeLeave())) return;
  VIEW = v; if(v === 'path'){ QZ = freshQZ(); FIN = {mode:'idle', idx:0, ans:{}, result:null}; }
  await refreshAll(); renderNavTabs(); renderView(); window.scrollTo(0,0);
}
function renderView(){
  const c = document.getElementById('content'); if(!c) return;
  const f = {path:vPath, module:vModule, final:vFinal, mileage:vMileage, resources:vResources, dash:vDash, curriculum:vCurriculum, mods:vMods, detail:vModDetail}[VIEW];
  c.innerHTML = f ? f() : '';
  Clock.paint();
}
function chipHtml(){ return (ROLE==='moderator' && MOD_SEES_OWN_TIME) ? '<span id="clockChip" class="chip" style="display:none"></span>' : ''; }
function freshQZ(){ return {mod:null, idx:0, ans:{}, wrong:{}, ft:{}, wp:0, started:false, finished:false, score:null, attempt:0}; }

// ── LEAVING A TIMED SEGMENT ──────────────────────────────────────────────────
async function leaveSegment(){
  if(!Clock.seg) return;
  const t = Clock.seg.type;
  await Clock.stop(t === 'quiz' ? 'incomplete' : t === 'final' ? 'abandoned' : 'left');
}
async function safeLeave(){
  if(Clock.seg && Clock.seg.type === 'final'){
    const ok = await askConfirm('Leave the final assessment?', 'This attempt will not be scored and will not count as used. The time so far is still recorded.', 'Leave');
    if(!ok) return false;
  }
  await leaveSegment();
  return true;
}

// ── LEARNING PATH ────────────────────────────────────────────────────────────
function ring(pct){
  const r = 38, c = 2*Math.PI*r;
  return '<div class="ring"><svg width="92" height="92" viewBox="0 0 92 92"><circle cx="46" cy="46" r="'+r+'" fill="none" stroke="var(--bg4)" stroke-width="8"/><circle cx="46" cy="46" r="'+r+'" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-pct/100))+'"/></svg><div class="ring-num">'+pct+'%</div></div>';
}
function contactLine(){ if(!LOCKOUT_CONTACT.email) return '<strong>' + esc(LOCKOUT_CONTACT.name) + '</strong>'; return '<strong>' + esc(LOCKOUT_CONTACT.name) + '</strong> (<a href="mailto:' + esc(LOCKOUT_CONTACT.email) + '">' + esc(LOCKOUT_CONTACT.email) + '</a>)'; }
function vPath(){
  const u = computeUser(ME.email), total = ATLAS_MODULES.length;
  const pct = Math.round(u.doneCount / total * 100), first = ME.name.split(' ')[0];
  const totalMin = ATLAS_MODULES.reduce((s,m) => s + m.min, 0);
  let cls = 'hero-box', main;
  const tl = MOD_SEES_OWN_TIME && u.activeT > 0 ? '<div class="progress-label" style="margin-top:6px">Active training time so far: ' + fmtDur(u.activeT) + '</div>' : '';
  if(u.certified){
    cls += ' certified';
    main = '<div class="pill pill-green" style="margin-bottom:10px">&#10003; Certified</div><div class="hero-title2">You are certified, ' + esc(first) + '.</div><div class="hero-sub2">All ' + total + ' modules are complete and the final assessment was passed at ' + u.passedRow.Score + '%. Your coordinator will confirm next steps.</div>' + tl;
  } else if(u.locked){
    cls += ' locked';
    main = '<div class="pill pill-red" style="margin-bottom:10px">Final assessment locked</div><div class="hero-title2">You have used all ' + u.allowance + ' attempts.</div><div class="hero-sub2">An admin reviews every case and can grant an extra attempt. Contact ' + contactLine() + '.</div><button class="btn btn-secondary" style="width:auto" onclick="openFinal()">See details</button>' + tl;
  } else if(u.allDone){
    main = '<div class="hero-title2">One step left, ' + esc(first) + '.</div><div class="hero-sub2">All ' + total + ' modules are complete. Pass the final assessment (' + FINAL_PASS_PCT + '%, ' + (u.allowance - u.used) + ' of ' + u.allowance + ' attempts left) to be certified.</div><button class="btn btn-primary" style="width:auto" onclick="openFinal()">Take the final assessment &rarr;</button>' + tl;
  } else if(u.doneCount === 0){
    main = '<div class="hero-title2">Welcome, ' + esc(first) + '. Let us get you ready.</div><div class="hero-sub2">' + total + ' modules in order, about ' + totalMin + ' minutes in total, then a final assessment. Every module stays open for review once complete.</div>' + tl;
  } else {
    main = '<div class="hero-title2">Welcome back, ' + esc(first) + '.</div><div class="hero-sub2">Pick up where you left off.</div><div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div><div class="progress-label">' + u.doneCount + ' of ' + total + ' modules complete</div>' + tl;
  }
  const steps = ATLAS_MODULES.map((m,i) => {
    const done = u.done.has(m.id), unlocked = i === 0 || u.done.has(ATLAS_MODULES[i-1].id), current = unlocked && !done;
    const dot = done ? 'done' : current ? 'current' : 'locked';
    return '<div class="step-row' + (unlocked?' clickable':'') + '"' + (unlocked ? ' onclick="openModule(' + i + ')"' : '') + '><div class="step-dot ' + dot + '">' + (done ? '&#10003;' : (i+1)) + '</div><div class="step-body"><div class="step-title' + (unlocked?'':' locked') + '">' + m.ic + ' ' + esc(m.title) + '</div><div class="step-meta">' + (unlocked ? ('~' + m.min + ' min &middot; ' + (done ? 'Completed' : current ? 'Up next' : '') + (m.gate==='check' ? ' &middot; knowledge check' : '')) : 'Locked: complete the previous module') + '</div></div></div>';
  }).join('');
  const fd = u.certified ? 'done' : u.locked ? 'bad' : u.allDone ? 'current' : 'locked';
  const finalStep = '<div class="step-row' + (u.allDone?' clickable':'') + '"' + (u.allDone ? ' onclick="openFinal()"' : '') + '><div class="step-dot ' + fd + '">' + (u.certified ? '&#10003;' : u.locked ? '!' : (total+1)) + '</div><div class="step-body"><div class="step-title' + (u.allDone?'':' locked') + '">&#127919; Final assessment</div><div class="step-meta">' + (u.allDone ? (u.certified ? 'Passed at ' + u.passedRow.Score + '%' : u.locked ? 'Locked, contact your coordinator' : FINAL_CHECK.length + ' questions &middot; attempt ' + (u.used+1) + ' of ' + u.allowance) : 'Unlocks after Module ' + total) + '</div></div></div>';
  return '<h1 class="page-h1">My Learning Path</h1><p class="page-sub">' + u.doneCount + ' of ' + total + ' modules complete</p>'
    + '<div class="' + cls + '"><div class="hero-main">' + main + '</div>' + ring(u.certified ? 100 : pct) + '</div>'
    + '<div class="card"><div class="stepper">' + steps + finalStep + '</div></div>';
}

// ── MODULE VIEWER ────────────────────────────────────────────────────────────
async function openModule(i){
  if(!(await safeLeave())) return;
  CUR_MOD = i; VIEW = 'module'; QZ = freshQZ();
  const m = ATLAS_MODULES[i];
  renderNavTabs(); renderView(); window.scrollTo(0,0);
  await Clock.start({module:m.id, type:'module', attempt:nextAttempt(ME.email, m.id, 'module'), visit:isDone(m.id) ? 'review' : 'initial'});
}
async function backToPath(){ if(!(await safeLeave())) return; VIEW = 'path'; QZ = freshQZ(); await refreshAll(); renderNavTabs(); renderView(); window.scrollTo(0,0); }
async function continueFromModule(){
  if(CUR_MOD < ATLAS_MODULES.length - 1){ await openModule(CUR_MOD + 1); }
  else { await openFinal(); }
}
function vModule(){
  const m = ATLAS_MODULES[CUR_MOD], done = isDone(m.id), isLast = CUR_MOD === ATLAS_MODULES.length - 1;
  let gate;
  if(m.gate === 'none'){
    gate = done
      ? '<div class="stub-gate"><span class="pill pill-green">&#10003; Completed</span> <span class="muted" style="font-size:13px;margin-left:8px">Time spent here now is logged as review.</span></div>'
      : '<div class="stub-gate"><button class="btn btn-primary" style="width:auto" onclick="completeNone(\'' + m.id + '\')">' + esc(m.cta || 'Mark complete') + ' &rarr;</button></div>';
  } else gate = renderQuiz(m, done);
  return '<div class="module-page"><div class="r-top"><div class="r-eyebrow">Module ' + (CUR_MOD+1) + ' of ' + ATLAS_MODULES.length + '</div>' + chipHtml() + '</div>'
    + '<div class="r-title">' + m.ic + ' ' + esc(m.title) + '</div><div class="r-sub">' + esc(m.sub) + '</div>'
    + '<div class="r-meta"><span>~' + m.min + ' min</span>' + (done ? '<span class="pill pill-blue pill-sm">Review</span>' : '') + '</div>'
    + '<div class="reader">' + m.body + '</div>' + gate
    + '<div class="mod-nav-row"><button class="btn btn-ghost" onclick="backToPath()">&larr; Back to path</button>'
    + (done ? '<button class="btn btn-secondary" onclick="continueFromModule()">' + (isLast ? 'Go to final assessment' : 'Continue to next module') + ' &rarr;</button>' : '') + '</div></div>';
}
async function completeNone(id){
  await Clock.stop('completed');
  toast('Module complete.');
  renderView();
  await Clock.start({module:id, type:'module', attempt:nextAttempt(ME.email, id, 'module'), visit:'review'});
}

// ── KNOWLEDGE CHECK (Sesame logic: one question at a time, a wrong pick lets you try again; retry resets and is timed) ──
function quizReviewHtml(qs){
  return qs.map((q, i) => {
    const pk = QZ.ans[i], ok = pk === q.a;
    return '<div class="quiz-card" style="margin-top:10px"><div class="quiz-progress">Question ' + (i+1) + ' of ' + qs.length + ' <span class="pill pill-sm ' + (ok ? 'pill-green' : 'pill-red') + '">' + (ok ? '&#10003; Correct' : '&#10007; Incorrect') + '</span></div><div class="quiz-q">' + q.q + '</div>'
      + '<div class="quiz-opt ' + (ok ? 'correct' : 'incorrect') + '" style="cursor:default">' + (pk !== undefined ? q.opts[pk] : '') + '</div>'
      + (!ok && REVIEW_SHOWS_CORRECT_ANSWER.check ? '<div class="quiz-opt correct" style="cursor:default"><span class="muted">Correct answer:</span> ' + q.opts[q.a] + '</div>' : '') + '</div>';
  }).join('');
}
function renderQuiz(m, done){
  const qs = getModQuestions(m.id);
  if(!qs.length) return '<div class="stub-gate"><div class="locked-note">No questions are defined for this module yet.</div></div>';
  const att = QZ.attempt || '';
  if(!QZ.started){
    return '<div class="quiz-card"><div class="quiz-progress">Knowledge check &middot; ' + qs.length + ' questions ' + (done ? '<span class="pill pill-green pill-sm">&#10003; Completed</span>' : '') + '</div>'
      + '<div class="quiz-q" style="margin-bottom:8px">' + (done ? 'Take the check again as a refresher.' : 'Ready to check what you learned?') + '</div>'
      + '<p class="muted" style="font-size:13.5px;line-height:1.55;margin:0 0 16px">One question at a time. ' + (CHECK_MODE === 'lenient' ? 'A wrong pick lets you try again, but only your first pick counts toward the score.' : '<strong>Once you select an answer it is locked.</strong> To change an answer you have to retry the whole check.') + ' You need ' + CHECK_PASS_PCT + '% to pass and can retry as often as you like. Every attempt is timed on its own.' + (done ? ' Time on a repeat is logged as review.' : '') + '</p>'
      + '<button class="btn btn-primary" style="width:auto" onclick="startQuiz()">' + (done ? 'Retry the check' : 'Start knowledge check') + ' &rarr;</button></div>';
  }
  if(QZ.finished){
    if(QZ.review) return '<div class="quiz-card"><div class="quiz-progress">Knowledge check &middot; attempt ' + att + ' &middot; review</div><div class="quiz-q">Your answers: ' + QZ.score + '%</div><button class="btn btn-secondary" style="width:auto" onclick="QZ.review=false;renderView()">&larr; Back to result</button></div>' + quizReviewHtml(qs);
    const pass = QZ.score >= CHECK_PASS_PCT;
    return '<div class="quiz-card"><div class="quiz-progress">Knowledge check &middot; attempt ' + att + ' &middot; ' + (pass ? '<span class="pill pill-green pill-sm">&#10003; Passed</span>' : '<span class="pill pill-red pill-sm">Not yet</span>') + '</div>'
      + '<div class="quiz-q">' + (pass ? 'Check complete.' : 'Not quite there yet.') + ' Score: ' + QZ.score + '%</div>'
      + '<p class="muted" style="font-size:13.5px;margin:0 0 16px">' + (qs.length - QZ.wp) + ' of ' + qs.length + ' correct. ' + (pass ? 'You can review your answers, retry to reset the questions, or move on.' : CHECK_PASS_PCT + '% is needed to complete this module. Review your answers, then retry the check.') + '</p>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-secondary" onclick="QZ.review=true;renderView()">Review answers</button><button class="btn ' + (pass ? 'btn-secondary' : 'btn-primary') + '" style="width:auto" onclick="retryQuiz()">&#8635; Retry the check</button></div></div>';
  }
  const idx = QZ.idx, q = qs[idx], pk = QZ.ans[idx], answered = pk !== undefined, jw = QZ.wrong[idx];
  const allAnswered = qs.every((_, i) => QZ.ans[i] !== undefined);
  const dots = qs.map((_, i) => { const a = QZ.ans[i] !== undefined; return '<div class="quiz-dot' + (i===idx?' active':'') + (a?' answered':'') + '"' + (a ? ' onclick="jumpQ(' + i + ')" style="cursor:pointer"' : '') + '></div>'; }).join('');
  const opts = q.opts.map((o, oi) => {
    let c = 'quiz-opt';
    if(answered){
      if(oi === pk) c += (pk === q.a ? ' correct' : ' incorrect');
      else if(pk !== q.a && REVIEW_SHOWS_CORRECT_ANSWER.check && oi === q.a) c += ' correct';
    } else if(jw === oi) c += ' incorrect';
    return answered ? '<div class="' + c + '" style="cursor:default">' + o + '</div>' : '<button class="' + c + '" onclick="answerQuiz(' + idx + ',' + oi + ')">' + o + '</button>';
  }).join('');
  let fb = '';
  if(answered) fb = pk === q.a ? '<div class="quiz-fb correct">&#10003; Correct.</div>' : '<div class="quiz-fb incorrect">&#10007; Incorrect. This answer is locked. Retry the check to try again.</div>';
  else if(jw !== undefined) fb = '<div class="quiz-fb incorrect">&#10007; Not quite. Give it another try.</div>';
  const back = idx > 0 ? '<button class="btn btn-ghost" style="width:auto;margin-top:14px" onclick="prevQ()">&larr; Back</button>' : '';
  const nav = idx < qs.length - 1
    ? '<button class="btn btn-secondary" style="width:auto;margin-top:14px"' + (answered ? '' : ' disabled') + ' onclick="nextQ()">Next question &rarr;</button>'
    : '<button class="btn btn-primary" style="width:auto;margin-top:14px"' + (allAnswered ? '' : ' disabled') + ' onclick="finishQuiz()">Finish check &rarr;</button>';
  return '<div class="quiz-card"><div class="quiz-progress">Knowledge check &middot; question ' + (idx+1) + ' of ' + qs.length + ' &middot; attempt ' + att + '</div>'
    + '<div class="quiz-dots">' + dots + '</div><div class="quiz-q">' + q.q + '</div>' + opts + fb
    + '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">' + back + nav + '<button class="btn btn-ghost" style="width:auto;margin-top:14px;margin-left:auto" onclick="retryQuiz()" title="Reset the questions and start this check again">&#8635; Retry (reset)</button></div></div>';
}
async function startQuiz(){
  const m = ATLAS_MODULES[CUR_MOD], visit = isDone(m.id) ? 'review' : 'initial';
  await Clock.stop('moved_to_check');            // end the reading segment, start the attempt segment
  QZ = freshQZ(); QZ.mod = m.id; QZ.started = true; QZ.attempt = nextAttempt(ME.email, m.id, 'quiz');
  renderView();
  await Clock.start({module:m.id, type:'quiz', attempt:QZ.attempt, visit});
  renderView();
}
async function retryQuiz(){
  const m = ATLAS_MODULES[CUR_MOD];
  if(QZ.started && !QZ.finished) await Clock.stop('incomplete');    // reset mid-attempt: that attempt is logged incomplete
  else await Clock.stop('left');                                     // retry after finishing: close the review-reading segment
  await refreshAll();
  const visit = isDone(m.id) ? 'review' : 'initial';
  QZ = freshQZ(); QZ.mod = m.id; QZ.started = true; QZ.attempt = nextAttempt(ME.email, m.id, 'quiz');
  renderView();
  await Clock.start({module:m.id, type:'quiz', attempt:QZ.attempt, visit});
  renderView(); toast('Questions reset. New attempt started.');
}
function answerQuiz(qi, oi){
  const q = getModQuestions(ATLAS_MODULES[CUR_MOD].id)[qi];
  if(QZ.ans[qi] !== undefined) return;
  if(CHECK_MODE === 'lenient'){
    // lenient (Sesame style): keep picking until correct, only the first pick is scored
    if(QZ.ft[qi] === undefined) QZ.ft[qi] = (oi === q.a);
    if(oi === q.a){ QZ.ans[qi] = oi; delete QZ.wrong[qi]; } else { QZ.wrong[qi] = oi; QZ.wp++; }
  } else {
    // strict: the answer locks on selection
    QZ.ans[qi] = oi; QZ.ft[qi] = (oi === q.a); if(oi !== q.a) QZ.wp++;
  }
  renderView();
}
function nextQ(){ QZ.idx = Math.min(getModQuestions(ATLAS_MODULES[CUR_MOD].id).length - 1, QZ.idx + 1); renderView(); }
function prevQ(){ QZ.idx = Math.max(0, QZ.idx - 1); renderView(); }
function jumpQ(i){ if(QZ.ans[i] !== undefined){ QZ.idx = i; renderView(); } }
async function finishQuiz(){
  const m = ATLAS_MODULES[CUR_MOD], qs = getModQuestions(m.id);
  const ok = qs.filter((_, i) => QZ.ft[i] === true).length;
  const score = Math.round(ok / qs.length * 100), pass = score >= CHECK_PASS_PCT;
  await Clock.stop(pass ? 'completed' : 'failed', score);
  QZ.finished = true; QZ.score = score; QZ.review = false;
  toast(pass ? 'Module complete.' : 'Not passed yet. Review your answers and retry.'); renderView();
  // after a pass the module is complete, so further time here is review; after a fail the module is still initial
  await refreshAll();
  await Clock.start({module:m.id, type:'module', attempt:nextAttempt(ME.email, m.id, 'module'), visit:isDone(m.id) ? 'review' : 'initial'});
}

}
async function beginFinal(){
  const u = computeUser(ME.email);
  FIN = {mode:'run', idx:0, ans:{}, result:null, attempt:u.used + 1};
  renderView(); window.scrollTo(0,0);
  await Clock.start({module:'final', type:'final', attempt:u.used + 1, visit:'initial'});   // the timer starts here, at the Begin click
}
function answerFinal(oi){ if(FIN.ans[FIN.idx] !== undefined) return; FIN.ans[FIN.idx] = oi; renderView(); }
function nextFinal(){ FIN.idx = Math.min(FINAL_CHECK.length - 1, FIN.idx + 1); renderView(); }
function prevFinal(){ FIN.idx = Math.max(0, FIN.idx - 1); renderView(); }
function jumpFinal(i){ if(FIN.ans[i] !== undefined){ FIN.idx = i; renderView(); } }
async function submitFinal(){
  let correct = 0; FINAL_CHECK.forEach((q, i) => { if(FIN.ans[i] === q.a) correct++; });
  const pct = Math.round(correct / FINAL_CHECK.length * 100), pass = pct >= FINAL_PASS_PCT, attempt = FIN.attempt;
  await Clock.stop(pass ? 'passed' : 'failed', pct);
  if(pass){
    const t = iso(Date.now());
    try{ await Store.saveRow(mkRow({email:ME.email, module:'final', type:'certified', attempt:'', score:pct, dur:0, idle:0, start:t, end:t, seg:uid('cert-'), status:'passed'})); }catch(e){ toast('Certification record could not be saved right now.'); }
  }
  await refreshAll();
  FIN.result = {correct, total:FINAL_CHECK.length, pct, pass, attempt}; FIN.mode = 'result';
  renderView(); window.scrollTo(0,0);
}

  return '<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><h1 class="page-h1" style="margin:0">Moderators</h1><span style="margin-left:auto"></span><button class="btn btn-primary" style="width:auto" onclick="document.getElementById(\'addForm\').style.display=\'block\'">+ Add moderator</button></div>'
    + '<p class="page-sub" style="margin-top:4px">' + act.length + ' active &middot; ' + ina.length + ' deactivated &middot; open Details to see full time, attempts and flags</p>'
    + '<div class="card" id="addForm" style="display:none;margin-bottom:16px"><div class="form-grid"><div><label class="field-label" for="nmName">Full name</label><input class="field-input" id="nmName" placeholder="Jane Smith"></div><div><label class="field-label" for="nmEmail">Centific email</label><input class="field-input" id="nmEmail" placeholder="jane.smith@centific.com"></div><div><label class="field-label" for="nmCohort">Cohort</label><input class="field-input" id="nmCohort" placeholder="A"></div><div style="align-self:end"><button class="btn btn-primary" onclick="addMod()">Add moderator</button></div></div><div class="err-msg" id="nmErr"></div></div>'
    + '<div class="card"><div class="admin-tbl-wrap"><table class="admin-tbl"><tr><th>Name</th><th>Email</th><th>Cohort</th><th>Status</th><th>Active time</th><th></th></tr>' + act.map(row).join('') + ina.map(row).join('') + '</table></div></div>';
}
async function addMod(){
  const n = document.getElementById('nmName').value.trim(), e = document.getElementById('nmEmail').value.trim().toLowerCase(), c = document.getElementById('nmCohort').value.trim();
  const err = document.getElementById('nmErr');
  if(!n){ err.textContent = 'Enter a name.'; return; }
  if(!/^[^@\s]+@centific\.com$/.test(e)){ err.textContent = 'Use an @centific.com email.'; return; }
  if(DIR.some(d => d.email === e)){ err.textContent = 'That email is already in the list.'; return; }
  DIR.push({name:n, email:e, role:'moderator', cohort:c, active:'yes'}); await Store.saveUsers(DIR); renderView(); toast('Moderator added.');
}
async function setActive(email, v){
  const d = DIR.find(x => x.email === email); if(!d) return;
  if(v === 'no' && !(await askConfirm('Deactivate ' + d.name + '?', 'They will no longer be able to sign in. Their history is kept.', 'Deactivate'))) return;
  d.active = v; await Store.saveUsers(DIR); renderView();
}

// ── DEMO CONTROLS DRAWER ─────────────────────────────────────────────────────
function openDemo(){
  const st = Store.failures;
  document.getElementById('overlays').innerHTML = '<div class="overlay" style="padding:0;justify-content:flex-end;align-items:stretch" onclick="if(event.target===this)closeModal()"><div class="drawer">'
    + '<div style="display:flex;align-items:center;gap:10px"><h3 style="flex:1">Demo controls</h3><button class="icon-btn" onclick="closeModal()" aria-label="Close">&#10005;</button></div>'
    + '<div class="muted" style="font-size:12.5px;margin-bottom:6px">For demos only. Not part of the real app.</div>'
    + '<div class="d-sec"><h4>Timers (seconds)</h4>'
    + '<div class="d-row"><label for="cfgIdle">"Still there?" after</label><input class="field-input" id="cfgIdle" type="number" min="3" value="' + CFG.idleAfter + '"></div>'
    + '<div class="d-row"><label for="cfgWait">Pause if no answer after</label><input class="field-input" id="cfgWait" type="number" min="3" value="' + CFG.promptWait + '"></div>'
    + '<div class="d-row"><label for="cfgHb">Checkpoint every</label><input class="field-input" id="cfgHb" type="number" min="3" value="' + CFG.hb + '"></div>'
    + '<button class="btn btn-secondary" onclick="applyCfg()">Apply</button><button class="btn btn-secondary" onclick="fastCfg()">Fast demo preset (10 / 10 / 10)</button><button class="btn btn-ghost" onclick="defaultCfg()">Back to defaults (180 / 120 / 120)</button></div>'
    + '<div class="d-sec"><h4>Time-tracking scenarios</h4>'
    + '<button class="btn btn-secondary" onclick="demoClose(true)">Simulate browser closed mid-module</button>'
    + '<button class="btn btn-secondary" onclick="demoClose(false)">Simulate crash (no closing checkpoint)</button>'
    + '<button class="btn btn-secondary" onclick="demoSweep()">Run recovery cleanup now</button>'
    + '<button class="btn btn-secondary" onclick="demoFail()">Fail the next 3 saves (held and re-sent)' + (st ? ' [' + st + ' pending]' : '') + '</button>'
    + '<div class="muted" style="font-size:12px;line-height:1.5">Close and crash end the session without a clean save. Sign in again as the same moderator: the open segment is closed as "recovered" and shows in the admin view.</div></div>'
    + '<div class="d-sec"><h4>Moderator state</h4>'
    + '<button class="btn btn-secondary" onclick="demoComplete()">Complete all modules (no time added)</button>'
    + '<button class="btn btn-secondary" onclick="demoLockout()">Jump to final lockout</button>'
    + '<div class="muted" style="font-size:12px;line-height:1.5">Applies to the signed-in moderator, or to test.mod when signed in as admin.</div></div>'
    + '<div class="d-sec"><h4>Live clock</h4><div class="live-box" id="demoLive"></div></div>'
    + '<div class="d-sec"><h4>Data</h4><button class="btn btn-danger" onclick="demoReset()">Reset demo data</button></div></div></div>';
  updateDemoLive();
}
function updateDemoLive(){
  const el = document.getElementById('demoLive'); if(!el) return;
  const s = Clock.seg;
  el.innerHTML = s ? ('State: <strong>' + Clock.state + '</strong><br>Segment: ' + esc(s.module) + ' / ' + s.type + ' #' + s.attempt + ' (' + s.visit + ')<br>Active: ' + Clock.shown() + 's &middot; Idle: ' + s.idle + 's &middot; Quiet: ' + Clock.quiet + 's<br>Checkpoints sent: ' + Clock.hbCount + ' &middot; next at active ' + Clock.nextBeat + 's<br>Thresholds: ' + CFG.idleAfter + ' / ' + CFG.promptWait + ' / ' + CFG.hb) : ('No segment running.<br>Thresholds: ' + CFG.idleAfter + ' / ' + CFG.promptWait + ' / ' + CFG.hb);
}
function applyCfg(){
  const g = id => Math.max(3, parseInt(document.getElementById(id).value, 10) || 3);
  CFG.idleAfter = g('cfgIdle'); CFG.promptWait = g('cfgWait'); CFG.hb = g('cfgHb');
  if(Clock.seg) Clock.nextBeat = Clock.seg.active + CFG.hb; toast('Timers applied.'); updateDemoLive();
}
function fastCfg(){ CFG = {idleAfter:10, promptWait:10, hb:10}; if(Clock.seg) Clock.nextBeat = Clock.seg.active + 10; openDemo(); toast('Fast demo timers on.'); }
function defaultCfg(){ CFG = Object.assign({}, CFG_DEFAULT); openDemo(); toast('Default timers restored.'); }
function demoClose(clean){
  if(!Clock.simulateClose(clean)){ toast('No timed segment is running. Open a module as a moderator first.'); return; }
  closeModal(); ME = null; ROLE = null; renderLogin();
  toast(clean ? 'Simulated: browser closed. Sign in again to see the recovered segment.' : 'Simulated: crash. Sign in again to see the recovered segment.');
}
async function demoSweep(){ const n = await Store.recoverStale(SESSION_ID); await refreshAll(); if(ROLE) renderView(); toast(n ? n + ' stale segment' + (n>1?'s':'') + ' recovered.' : 'Nothing stale to recover.'); }
function demoFail(){ Store.failures = 3; openDemo(); toast('The next 3 saves will fail, then re-send on next open.'); }
function demoTarget(){ return (ME && ME.role === 'moderator') ? ME.email : 'test.mod@centific.com'; }
async function demoFillModules(email){
  await refreshAll(); const u = computeUser(email), t = iso(Date.now());
  for(const m of ATLAS_MODULES){ if(u.done.has(m.id)) continue; await Store.saveRow(mkRow({email, module:m.id, type:m.gate==='check'?'quiz':'module', attempt:1, score:m.gate==='check'?100:'', dur:0, idle:0, start:t, end:t, seg:uid('seed-demo-'), status:'completed'})); }
}
async function demoComplete(){
  const email = demoTarget(); await leaveSegment(); await demoFillModules(email); await refreshAll();
  closeModal(); if(ROLE === 'moderator'){ VIEW = 'path'; renderNavTabs(); } renderView(); toast('All modules marked complete for ' + email + '.');
}
async function demoLockout(){
  const email = demoTarget(); await leaveSegment(); await demoFillModules(email); await refreshAll();
  let u = computeUser(email), t = iso(Date.now());
  while(u.used < u.allowance && !u.passedRow){
    await Store.saveRow(mkRow({email, module:'final', type:'final', attempt:u.used+1, score:55, dur:600, idle:0, start:t, end:t, seg:uid('seed-demo-'), status:'failed'}));
    await refreshAll(); u = computeUser(email);
  }
  closeModal(); if(ROLE === 'moderator'){ VIEW = 'path'; renderNavTabs(); FIN = {mode:'idle', idx:0, ans:{}, result:null}; } renderView(); toast('Final assessment locked out for ' + email + '.');
}
async function demoReset(){
  if(!(await askConfirm('Reset demo data?', 'This restores the seeded history and clears everything entered in this browser.', 'Reset'))) return;
  await leaveSegment(); await Store.reset(); await refreshAll();
  ME = null; ROLE = null; closeModal(); renderLogin(); toast('Demo data reset.');
}

// ── BOOT ─────────────────────────────────────────────────────────────────────
(async function boot(){
  try{ const th = localStorage.getItem('atlas_theme'); if(th) document.documentElement.setAttribute('data-theme', th); }catch(e){}
  syncDB(); await refreshAll();
  await Store.recoverStale(SESSION_ID); await flushOutbox();
  Clock.init();
  renderLogin();
  // scheduled cleanup stand-in + admin auto-refresh + held-save retry
  setInterval(async () => {
    const n = await Store.recoverStale(SESSION_ID);
    await flushOutbox();
    if(ROLE === 'admin' && (VIEW === 'dash' || VIEW === 'detail') && !document.querySelector('#overlays .overlay')){ await refreshAll(); renderView(); }
    else if(n){ await refreshAll(); }
  }, 15000);
})();
</script>
