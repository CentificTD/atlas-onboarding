<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="googlebot" content="noindex,nofollow">
<title>Atlas · Moderator Onboarding</title>
<style>
:root{
  --accent:#0071e3; --accent-dim:#0058b3; --accent-soft:rgba(0,113,227,0.15); --accent-ink:#4DA3FF;
  --amber:#f59e0b; --amber-bg:#FFF7E6; --amber-text:#7A4A00; --amber-border:#E8C47A;
  --green:#22c55e; --green-bg:#EAF3DE; --green-text:#27500A;
  --red:#ef4444; --red-bg:#FEF2F2; --red-text:#991b1b;
  --blue:#3b82f6; --blue-bg:#EFF6FF; --blue-text:#1e3a8a;
  --font:-apple-system,'SF Pro Display','SF Pro Text',BlinkMacSystemFont,'Helvetica Neue',sans-serif;
  --font-num:'Avenir Next','Avenir','SF Pro Display',-apple-system,sans-serif;
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1218; --bg2:#161B24; --bg3:#1D2430; --bg4:#283141;
  --text:#E8EDF5; --text2:#A3AEC0; --text3:#8693A6;
  --border:#1D2330; --border-strong:#2B3446;
  --input-bg:#161B24; --card-bg:#161B24; --modal-bg:#1A212D;
  --shadow-sm:0 2px 12px rgba(0,0,0,0.50); --shadow-md:0 8px 40px rgba(0,0,0,0.62); --shadow-lg:0 20px 60px rgba(0,0,0,0.72);
  --accent-ink:#4DA3FF; --wash:.16;
}
[data-theme="light"]{
  color-scheme:light;
  --bg:#F3F6FA; --bg2:#FFFFFF; --bg3:#E9EEF5; --bg4:#DCE4EE;
  --text:#0F1A2B; --text2:#475569; --text3:#6B7789;
  --border:rgba(15,30,60,0.10); --border-strong:rgba(15,30,60,0.18);
  --input-bg:#EAF0F7; --card-bg:#FFFFFF; --modal-bg:#FFFFFF;
  --shadow-sm:0 2px 12px rgba(15,30,60,0.06); --shadow-md:0 8px 40px rgba(15,30,60,0.10); --shadow-lg:0 20px 60px rgba(15,30,60,0.14);
  --accent-ink:#0058B0; --wash:.10;
}
*{box-sizing:border-box;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;}input:focus,textarea:focus{outline:none;}
html,body{margin:0;padding:0;}
/* Clean background, same structure in both themes: flat base plus one soft accent wash from the top centre. Static, fixed. */
body{
  font-family:var(--font);color:var(--text);
  background:radial-gradient(1200px 560px at 50% -140px,rgba(0,113,227,var(--wash)) 0%,transparent 72%),var(--bg);
  background-attachment:fixed;
  transition:background .3s,color .3s;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
a{color:var(--accent-ink);}
#login{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(1200px 560px at 50% -140px,rgba(0,113,227,var(--wash)) 0%,transparent 72%),var(--bg);
  background-attachment:fixed;
}
.entry-card{background:var(--card-bg);border:.5px solid var(--border);border-top-color:rgba(0,113,227,0.5);border-radius:22px;box-shadow:var(--shadow-lg);padding:44px 40px 34px;width:100%;max-width:420px;text-align:center;}
.brand-mark{width:50px;height:50px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent-dim));display:flex;align-items:center;justify-content:center;color:#fff;margin:0 auto 14px;box-shadow:0 4px 22px rgba(0,113,227,0.38),0 1px 0 rgba(255,255,255,0.12) inset;}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:10px;}
.entry-title{font-size:25px;font-weight:600;letter-spacing:-.02em;margin-bottom:8px;}
.entry-sub{font-size:14.5px;color:var(--text2);line-height:1.55;margin-bottom:28px;}
.field-label{display:block;text-align:left;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);margin-bottom:7px;}
.field-input{width:100%;font-size:15.5px;padding:12px 14px;background:var(--input-bg);border:.5px solid var(--border-strong);border-radius:12px;color:var(--text);letter-spacing:-.005em;transition:border-color .18s,box-shadow .18s;}
.field-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.field-input::placeholder{color:var(--text3);}
textarea.field-input{resize:vertical;min-height:84px;line-height:1.5;}
.err-msg{color:var(--red);font-size:13px;margin-top:10px;min-height:18px;text-align:left;}
.hint-line{font-size:12.5px;color:var(--text3);margin-top:18px;line-height:1.5;}
.version-tag{font-size:10.5px;color:var(--text3);margin-top:22px;opacity:.8;}
.btn{font-size:15px;font-weight:500;letter-spacing:-.01em;padding:11px 16px;border-radius:12px;border:.5px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:all .22s cubic-bezier(.4,0,.2,1);width:100%;}
.btn-primary{background:var(--accent);color:#fff;font-weight:600;}
.btn-primary:hover{background:var(--accent-dim);transform:translateY(-1px);box-shadow:0 6px 18px var(--accent-soft);}
.btn-primary:active{transform:scale(.98);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;}
.btn-secondary{background:var(--bg2);color:var(--text);border:.5px solid var(--border-strong);width:auto;}
.btn-secondary:hover{background:var(--bg4);}
.btn-secondary:disabled{opacity:.5;cursor:not-allowed;}
.btn-ghost{background:transparent;color:var(--text2);border:.5px solid var(--border-strong);width:auto;font-size:13px;padding:8px 14px;}
.btn-ghost:hover{background:var(--bg3);color:var(--text);}
.btn-danger{background:transparent;color:var(--red);border:.5px solid var(--border-strong);width:auto;font-size:13px;padding:8px 14px;}
.btn-danger:hover{background:var(--red-bg);}
.btn-sm{font-size:12px;font-weight:500;padding:5px 12px;border-radius:8px;border:.5px solid var(--border-strong);background:var(--bg3);color:var(--accent-ink);cursor:pointer;white-space:nowrap;}
.btn-sm:hover{background:var(--accent);color:#fff;}
.page-wrap{max-width:1180px;margin:0 auto;padding:0 32px;width:100%;}
.shell{min-height:calc(100vh - 40px);}
.demo-bar{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;font-size:12px;color:var(--text2);padding:8px 16px;background:var(--bg2);border-bottom:.5px solid var(--border);text-align:center;}
.demo-bar .dd{width:7px;height:7px;border-radius:50%;background:var(--amber);flex-shrink:0;}
.app-header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:22px 0 18px;flex-wrap:wrap;}
.nav-left{display:flex;align-items:center;gap:12px;min-width:0;}
.nav-logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-dim));display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;box-shadow:0 2px 8px rgba(0,113,227,0.3);}
.nav-brand{font-size:15.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav-brand span{color:var(--text3);font-weight:400;}
.nav-right{display:flex;align-items:center;gap:12px;}
.who-text{font-size:13px;line-height:1.4;text-align:right;}
.role-line{color:var(--accent-ink);font-size:11.5px;}
.icon-btn{width:32px;height:32px;border-radius:8px;background:var(--bg3);display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:15px;}
.icon-btn:hover{background:var(--bg4);color:var(--text);}
.btn-signout{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:.5px solid var(--border-strong);color:var(--text2);font-size:12.5px;font-weight:600;}
.btn-signout:hover{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft);}
.nav-tabs{display:flex;gap:6px;background:var(--bg2);border:.5px solid var(--border);border-radius:13px;padding:5px;overflow-x:auto;scrollbar-width:none;box-shadow:var(--shadow-sm);margin-bottom:22px;}
.nav-tabs::-webkit-scrollbar{display:none;}
.nav-tab{display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;padding:9px 16px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--text2);transition:all .2s;flex:1;min-width:fit-content;}
.nav-tab:hover{color:var(--text);}
.nav-tab.active{background:linear-gradient(135deg,var(--accent),var(--accent-dim));color:#fff;font-weight:600;box-shadow:0 4px 14px var(--accent-soft);}
.content{padding:0 0 60px;min-width:0;overflow-x:hidden;width:100%;}
h1.page-h1{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:0 0 4px;}
.page-sub{font-size:14.5px;color:var(--text2);margin:0 0 24px;line-height:1.5;}
.sec-h{font-size:15px;font-weight:600;letter-spacing:-.01em;margin:26px 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.sec-h .grow{flex:1;}
.card{background:var(--card-bg);border:.5px solid var(--border);border-radius:18px;padding:20px 22px;box-shadow:var(--shadow-sm);}
.hero-box{background:var(--card-bg);border:.5px solid var(--border);border-radius:20px;padding:26px 28px;margin-bottom:26px;box-shadow:var(--shadow-sm);display:flex;gap:24px;align-items:center;}
.hero-box .hero-main{flex:1;min-width:0;}
.hero-box.certified{border-color:rgba(34,197,94,.35);}
.hero-box.locked{border-color:rgba(239,68,68,.4);}
.hero-title2{font-size:19px;font-weight:600;letter-spacing:-.015em;margin-bottom:6px;}
.hero-sub2{font-size:14px;color:var(--text2);line-height:1.5;margin-bottom:16px;}
.ring{position:relative;width:92px;height:92px;flex-shrink:0;}
.ring svg{transform:rotate(-90deg);}
.ring .ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-num);font-size:20px;font-weight:700;}
.progress-track{height:8px;border-radius:99px;background:var(--bg4);overflow:hidden;margin-bottom:8px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent-dim),var(--accent));border-radius:99px;transition:width .4s cubic-bezier(.4,0,.2,1);}
.progress-label{font-size:12.5px;color:var(--text3);}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:99px;font-size:11.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap;}
.pill-sm{padding:2px 8px;font-size:10.5px;}
.pill-green{background:var(--green-bg);color:var(--green-text);border:.5px solid rgba(34,197,94,.3);}
.pill-amber{background:var(--amber-bg);color:var(--amber-text);border:.5px solid var(--amber-border);}
.pill-blue{background:var(--blue-bg);color:var(--blue-text);border:.5px solid rgba(59,130,246,.3);}
.pill-red{background:var(--red-bg);color:var(--red-text);border:.5px solid rgba(239,68,68,.3);}
.pill-gray{background:var(--bg3);color:var(--text3);border:.5px solid var(--border-strong);}
.stepper{margin-top:6px;}
.step-row{display:flex;gap:14px;position:relative;padding-bottom:22px;}
.step-row:last-child{padding-bottom:0;}
.step-row:not(:last-child)::before{content:'';position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--border);}
.step-dot{width:31px;height:31px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex-shrink:0;background:var(--bg3);color:var(--text3);border:2px solid var(--border-strong);z-index:1;}
.step-dot.locked{opacity:.55;}
.step-dot.current{background:linear-gradient(135deg,var(--accent),var(--accent-dim));color:#fff;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);}
.step-dot.done{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,0.15);}
.step-dot.bad{background:var(--red);color:#fff;border-color:var(--red);}
.step-body{flex:1;padding-top:3px;min-width:0;}
.step-title{font-size:14.5px;font-weight:600;letter-spacing:-.01em;margin-bottom:2px;}
.step-title.locked{color:var(--text3);}
.step-meta{font-size:12px;color:var(--text3);}
.step-row.clickable{cursor:pointer;}
.step-row.clickable:hover .step-title{color:var(--accent-ink);}
.module-page{max-width:760px;margin:0 auto;}
.r-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.r-eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);}
.r-title{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-bottom:6px;}
.r-sub{font-size:14.5px;color:var(--text2);margin-bottom:8px;}
.r-meta{font-size:12.5px;color:var(--text3);margin-bottom:26px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.reader{font-size:15px;line-height:1.72;color:var(--text);}
.reader h2{font-size:17px;font-weight:600;letter-spacing:-.01em;margin:30px 0 12px;}
.reader h3{font-size:14.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--text2);margin:24px 0 10px;}
.reader p{margin:0 0 14px;color:var(--text2);}
.reader ul,.reader ol{margin:0 0 14px;padding-left:22px;color:var(--text2);}
.reader li{margin-bottom:7px;line-height:1.6;color:var(--text2);}
.reader strong{color:var(--text);}
.callout{display:flex;gap:11px;background:var(--bg3);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:13px 16px;margin:16px 0;}
.callout .c-ic{font-size:16px;line-height:1.4;flex-shrink:0;color:var(--accent-ink);}
.callout .c-tx{font-size:14.5px;line-height:1.6;color:var(--text2);}
.callout .c-tx strong{color:var(--text);}
.callout.warn{border-left-color:var(--amber);}.callout.warn .c-ic{color:var(--amber);}
.callout.danger{border-left-color:var(--red);}.callout.danger .c-ic{color:var(--red);}
.callout.info{border-left-color:var(--blue);}.callout.info .c-ic{color:var(--blue);}
.awaiting{display:flex;gap:11px;background:var(--amber-bg);border:1px dashed var(--amber-border);border-radius:12px;padding:14px 16px;margin:16px 0;}
.awaiting .a-ic{font-size:15px;flex-shrink:0;color:var(--amber-text);}
.awaiting .a-tx{font-size:13.5px;line-height:1.6;color:var(--amber-text);}
.awaiting .a-tx strong{font-weight:700;color:var(--amber-text);}
.script{background:var(--bg3);border:.5px solid var(--border);border-radius:12px;padding:14px 16px;font-style:italic;font-size:14.5px;line-height:1.6;color:var(--text2);margin:10px 0;}
.tbl{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px;}
.tbl th{text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);padding:8px 10px;border-bottom:.5px solid var(--border-strong);}
.tbl td{padding:10px 10px;border-bottom:.5px solid var(--border);color:var(--text2);vertical-align:top;}
.video-embed{border-radius:14px;overflow:hidden;border:.5px solid var(--border);margin:14px 0;}
.video-embed iframe{width:100%;aspect-ratio:16/9;border:none;display:block;}
.video-embed video{width:100%;aspect-ratio:16/9;display:block;background:#000;}
.video-fallback{display:flex;align-items:center;justify-content:center;aspect-ratio:16/9;background:var(--bg3);color:var(--text2);font-size:13.5px;flex-direction:column;gap:10px;border:1px dashed var(--border-strong);border-radius:14px;margin:14px 0;text-align:center;padding:16px;}
.quiz-card{background:var(--card-bg);border:.5px solid var(--border);border-radius:16px;padding:22px 24px;margin-top:26px;}
.quiz-progress{font-size:12px;color:var(--text3);margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.quiz-q{font-size:16px;font-weight:600;letter-spacing:-.01em;margin-bottom:16px;line-height:1.45;}
.quiz-opt{display:block;width:100%;text-align:left;padding:13px 15px;border-radius:12px;border:1px solid var(--border-strong);margin-bottom:9px;font-size:14.5px;color:var(--text);background:var(--bg2);transition:all .15s;}
button.quiz-opt:hover{border-color:var(--accent);}
.quiz-opt.picked{border-color:var(--accent);background:var(--accent-soft);}
.quiz-opt.correct{border-color:var(--green);background:var(--green-bg);color:var(--green-text);}
.quiz-opt.incorrect{border-color:var(--red);background:var(--red-bg);color:var(--red-text);}
.quiz-fb{font-size:13.5px;line-height:1.55;margin-top:10px;padding:12px 14px;border-radius:10px;background:var(--bg3);color:var(--text2);font-weight:600;}
.quiz-fb.correct{background:var(--green-bg);color:var(--green-text);}
.quiz-fb.incorrect{background:var(--red-bg);color:var(--red-text);}
.quiz-dots{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.quiz-dot{width:7px;height:11px;border-radius:50%;background:var(--border-strong);transition:all .2s;}
.quiz-dot.active{background:var(--accent);width:22px;height:11px;border-radius:99px;box-shadow:0 0 8px rgba(0,113,227,0.4);}
.quiz-dot.answered{background:var(--accent-dim);opacity:.7;}
.stub-gate{background:var(--card-bg);border:.5px solid var(--border);border-radius:16px;padding:22px 24px;margin-top:26px;}
.mod-nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:26px;gap:10px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--text);color:var(--bg);border-radius:14px;padding:12px 20px;font-size:14px;font-weight:500;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.4,0,.2,1);z-index:1200;max-width:90vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.locked-note{display:flex;align-items:center;gap:10px;background:var(--bg3);border:.5px solid var(--border);border-radius:12px;padding:14px 16px;font-size:13.5px;color:var(--text2);margin-top:14px;}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:99px;background:var(--bg3);border:.5px solid var(--border-strong);font-size:12px;font-weight:600;color:var(--text2);font-family:var(--font-num);white-space:nowrap;}
.chip .cd{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.6s infinite;}
.chip.paused{background:var(--amber-bg);color:var(--amber-text);border-color:var(--amber-border);}
.chip.paused .cd{background:var(--amber);animation:none;}
.chip.blocked{background:var(--red-bg);color:var(--red-text);border-color:rgba(239,68,68,.3);}
.chip.blocked .cd{background:var(--red);animation:none;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
.kpi-card{background:var(--card-bg);border:.5px solid var(--border);border-radius:14px;padding:16px 18px;}
.kpi-val{font-family:var(--font-num);font-size:26px;font-weight:700;}
.kpi-lbl{font-size:11.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
.kpi-sub{font-size:11.5px;color:var(--text3);margin-top:3px;}
.filter-row{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.filter-chip{padding:7px 14px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--bg2);border:.5px solid var(--border-strong);color:var(--text2);}
.filter-chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.admin-tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.admin-tbl{width:100%;border-collapse:collapse;font-size:13.5px;}
.admin-tbl th{text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);padding:10px 12px;border-bottom:.5px solid var(--border-strong);white-space:nowrap;}
.admin-tbl td{padding:12px;border-bottom:.5px solid var(--border);vertical-align:middle;}
.admin-tbl tr:last-child td{border-bottom:none;}
.admin-tbl.dense td{padding:8px 12px;font-size:12.5px;}
.admin-tbl tr.clk{cursor:pointer;}
.admin-tbl tr.clk:hover td{background:var(--bg3);}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap;}
.muted{color:var(--text3);}
.mod-avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex-shrink:0;}
.mod-row-name{display:flex;align-items:center;gap:10px;}
.detail-wrap{max-width:980px;margin:0 auto;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-grid .full{grid-column:1/-1;}
@media (max-width:700px){.grid-2,.form-grid{grid-template-columns:1fr;}}

.faq-i summary::after{content:'';margin-left:auto;width:8px;height:8px;border-right:1.6px solid var(--text3);border-bottom:1.6px solid var(--text3);transform:rotate(45deg);transition:transform .2s;flex:none;}
.faq-i[open] summary::after{transform:rotate(-135deg);}
.faq-i summary:hover{background:var(--bg3);}
.faq-a{padding:0 18px 16px;font-size:14px;line-height:1.65;color:var(--text2);}

.fe-main{flex:1;min-width:220px;}
.fe-q{font-weight:600;font-size:14px;margin:4px 0 3px;overflow-wrap:anywhere;}
.fe-a{font-size:12.5px;color:var(--text3);overflow-wrap:anywhere;}
.fe-btns{display:flex;gap:6px;flex-wrap:wrap;}
.cat-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.tk-card{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:0 0 20px;}
.tk-card.locked{margin:20px 0 0;border-style:dashed;}
.tk-card.go{border-color:rgba(34,197,94,.4);}
.tk-ic{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;}
.tk-tx{flex:1;min-width:200px;}
.tk-h{font-weight:600;font-size:15px;margin-bottom:2px;}
.tk-p{font-size:13.5px;color:var(--text2);line-height:1.5;}
.tk-btn{width:auto;text-decoration:none;}
.res-card.btnlike{width:100%;text-align:left;cursor:pointer;font:inherit;}
.res-card.btnlike:hover{border-color:var(--accent);box-shadow:var(--shadow-sm);}

/* ── v0.3.1: light-mode hue, consistent controls, hover tips, resources, FAQ, tags, mileage, back link ── */
[data-theme="light"]{
  --bg:#E6EEFA; --bg2:#FFFFFF; --bg3:#E3ECF9; --bg4:#D3E1F4;
  --border:rgba(20,70,150,0.12); --border-strong:rgba(20,70,150,0.22);
  --input-bg:#EAF1FB; --wash:.22; --wash2:.12;
  --shadow-sm:0 2px 12px rgba(20,70,150,0.08); --shadow-md:0 8px 40px rgba(20,70,150,0.12);
}
[data-theme="dark"]{--wash2:.07;}
body{background:radial-gradient(1200px 560px at 50% -140px,rgba(0,113,227,var(--wash)) 0%,transparent 72%),radial-gradient(900px 600px at 100% 100%,rgba(0,113,227,var(--wash2)) 0%,transparent 70%),var(--bg);background-attachment:fixed;}
.btn-ghost,.btn-secondary{min-height:38px;}
.btn-sm{min-height:30px;display:inline-flex;align-items:center;justify-content:center;}
.btn-sm:disabled{opacity:.4;cursor:default;}
.btn-sm:disabled:hover{background:var(--bg3);color:var(--accent-ink);}
.btn-sm.danger{color:var(--red);}
.btn-sm.danger:hover{background:var(--red);color:#fff;}
.filter-chip{min-height:34px;display:inline-flex;align-items:center;gap:6px;}
.filter-chip:hover:not(.active){border-color:var(--accent);color:var(--text);}
.fc-n{font-family:var(--font-num);font-size:11px;opacity:.7;}
.sel,.srch input{min-height:40px;}
.pill[data-tip]{cursor:help;}
.tip{position:fixed;z-index:1400;max-width:290px;background:var(--modal-bg);color:var(--text2);border:.5px solid var(--border-strong);border-radius:12px;box-shadow:var(--shadow-lg);padding:10px 13px;font-size:12.5px;line-height:1.5;pointer-events:none;animation:popin .12s ease-out;}
.tip b{display:block;color:var(--text);font-size:12.5px;margin-bottom:3px;}
.back-link{display:inline-flex;align-items:center;gap:6px;padding:7px 12px 7px 8px;margin:0 0 16px -8px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--accent-ink);}
.back-link:hover{background:var(--accent-soft);}
.res-sec{margin-bottom:26px;}
.res-sec-h{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);margin:0 0 12px;}
.res-sec-h i{font-style:normal;font-family:var(--font-num);background:var(--bg3);border-radius:99px;padding:1px 8px;font-size:11px;}
.res-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
.rc{display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-height:128px;padding:18px 20px;border-radius:16px;border:.5px solid var(--border-strong);background:var(--card-bg);color:var(--text);text-decoration:none;text-align:left;width:100%;font:inherit;box-shadow:var(--shadow-sm);transition:border-color .15s,transform .15s,box-shadow .15s;}
a.rc:hover,button.rc:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-md);}
.rc.off{background:transparent;box-shadow:none;}
.rc-top{display:flex;gap:14px;align-items:flex-start;}
.rc-ic{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;flex:none;}
.rc.off .rc-ic{background:var(--bg3);color:var(--text3);}
.rc-tx{min-width:0;}
.rc-tx h4{margin:0 0 4px;font-size:15px;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere;}
.rc-tx p{margin:0;font-size:13px;color:var(--text2);line-height:1.5;overflow-wrap:anywhere;}
.rc-foot{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;padding-top:12px;border-top:.5px solid var(--border);}
.rc-foot.go{color:var(--accent-ink);}
.rc-foot.soon,.rc-foot.lock{color:var(--text3);}
.rc-dot{width:7px;height:7px;border-radius:50%;background:var(--amber);}
.faq-i{border:.5px solid var(--border-strong);border-radius:16px;background:var(--card-bg);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow-sm);}
.faq-i summary{padding:16px 20px;gap:14px;font-size:15px;font-weight:600;letter-spacing:-.01em;}
.faq-i summary:hover{background:var(--bg3);}
.faq-badge{width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;}
.faq-badge.a{background:var(--green-bg);color:var(--green-text);}
.faq-q{flex:1;min-width:0;overflow-wrap:anywhere;}
.faq-tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.faq-i summary::after{margin-left:6px;}
.faq-a{display:flex;gap:14px;align-items:flex-start;padding:18px 20px 20px;border-top:.5px solid var(--border);background:var(--bg3);font-size:14px;line-height:1.7;color:var(--text2);}
.faq-body{flex:1;min-width:0;}
.faq-body p{margin:0 0 10px;}
.faq-body p:last-child{margin:0;}
.tagpill{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;background:var(--bg3);border:.5px solid var(--border-strong);color:var(--text2);font-size:11px;font-weight:600;white-space:nowrap;}
.faq-a .tagpill{display:none;}
.tagbox{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:44px;padding:6px 10px;background:var(--input-bg);border:.5px solid var(--border-strong);border-radius:12px;cursor:text;}
.tagbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.tagbox input{flex:1;min-width:120px;background:none;border:none;color:var(--text);font-size:14px;padding:6px 2px;outline:none;}
.tagchip{display:inline-flex;align-items:center;gap:4px;padding:4px 6px 4px 11px;border-radius:99px;background:var(--accent-soft);color:var(--accent-ink);font-size:12.5px;font-weight:600;}
.tagchip button{width:18px;height:18px;border-radius:50%;line-height:1;font-size:15px;color:var(--accent-ink);}
.tagchip button:hover{background:var(--accent);color:#fff;}
#fqChips{display:contents;}
.fe-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;}
.fe-q{margin-top:0;}
.stat-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));padding:6px 4px;}
.ss-i{padding:12px 22px;border-left:.5px solid var(--border);}
.ss-i:first-child{border-left:none;}
.ss-v{font-family:var(--font-num);font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.15;}
.ss-v small{font-size:13px;font-weight:600;color:var(--text3);}
.ss-l{font-size:11.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-top:3px;}
.ss-s{font-size:11.5px;color:var(--text3);margin-top:2px;}
.admin-tbl th.r,.admin-tbl td.r{text-align:right;}
.nowrap{white-space:nowrap;}
.cell-main{font-weight:600;}
.cell-sub{font-size:11.5px;color:var(--text3);}
.route{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;}
.route-arrow{color:var(--text3);}
.note-cell{color:var(--text2);max-width:260px;font-size:13px;}
.admin-tbl tr:not(:first-child):hover td{background:var(--bg3);}
/* ═══ v0.3.2 ═══ */
/* Time chart: active and paid time as a tidy right column */
.tm-row{grid-template-columns:minmax(90px,130px) minmax(80px,1fr) 214px;}
.tm-v{display:flex;align-items:center;justify-content:flex-end;gap:8px;white-space:nowrap;font-family:var(--font-ui,inherit);font-size:13px;color:var(--text2);}
.tm-v b{font-family:var(--font-num);font-size:13.5px;font-weight:700;color:var(--text);}
.tm-v i{font-style:normal;font-size:11.5px;color:var(--text3);margin-left:-3px;}
.tm-paid{display:inline-flex;align-items:center;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--green-bg);color:var(--green-text);font-family:var(--font-num);}
.tm-head{margin-bottom:6px;}
.tm-head .tm-v{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);}
@media (max-width:700px){.tm-row{grid-template-columns:1fr;gap:6px}.tm-v{justify-content:flex-start}}
/* Mileage: compact tiles, chart + highlights */
.ml-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;}
.ml-stat{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card-bg);border:.5px solid var(--border);border-radius:16px;box-shadow:var(--shadow-sm);}
.ml-ic{width:38px;height:38px;border-radius:11px;background:var(--bg3);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;flex:none;}
.ml-v{font-family:var(--font-num);font-size:21px;font-weight:700;line-height:1.15;letter-spacing:-.01em;}
.ml-v small{font-size:12.5px;font-weight:600;color:var(--text3);}
.ml-l{font-size:12px;color:var(--text3);margin-top:2px;}
.ml-l span{color:var(--text3);opacity:.85;}
.ml-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:12px;margin-top:12px;align-items:stretch;}
.ml-bars{display:flex;flex-direction:column;gap:16px;padding:6px 0 4px;}
.ml-br{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) 92px;gap:14px;align-items:center;}
.ml-bl{min-width:0;}
.ml-bl span{display:block;font-size:13.5px;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ml-bl small{display:block;font-size:11.5px;color:var(--text3);margin-top:1px;}
.ml-bt{height:12px;border-radius:99px;background:var(--bg3);overflow:hidden;}
.ml-bt span{display:block;height:100%;border-radius:99px;}
.ml-bv{text-align:right;font-size:12px;color:var(--text3);line-height:1.25;font-family:var(--font-num);}
.ml-bv b{font-size:14px;color:var(--text);}
.ml-bv small{display:block;font-size:11px;}
.ml-cols{display:flex;align-items:flex-end;justify-content:space-around;gap:10px;height:218px;padding:6px 8px 0;}
.ml-col{flex:1;max-width:84px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0;}
.ml-cv{font-family:var(--font-num);font-size:12.5px;font-weight:700;margin-bottom:6px;}
.ml-cb{width:100%;max-width:46px;flex:1;display:flex;align-items:flex-end;}
.ml-cb span{display:block;width:100%;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#34d399,#22c55e);}
.ml-cx{font-size:12px;font-weight:500;margin-top:8px;color:var(--text2);white-space:nowrap;}
.ml-cs{font-size:11px;color:var(--text3);}
.ml-axis{font-size:11.5px;color:var(--text3);text-align:center;margin-top:12px;}
.ml-side .cc-h{margin-bottom:6px;}
.ml-hi{padding:12px 0;border-top:.5px solid var(--border);}
.ml-hi:first-of-type{border-top:none;padding-top:4px;}
.ml-hl{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);}
.ml-hv{font-size:15px;font-weight:700;margin-top:3px;}
.ml-hs{font-size:12.5px;color:var(--text2);margin-top:1px;}
@media (max-width:900px){.ml-stats{grid-template-columns:repeat(2,minmax(0,1fr));}.ml-grid{grid-template-columns:1fr;}.ml-br{grid-template-columns:minmax(90px,1fr) minmax(0,1.3fr) 76px;}}
/* FAQ editor inside the collapsible card */

#mlChartCard{display:flex;flex-direction:column;}
#mlChartCard .ml-bars{flex:1;justify-content:center;}

.bk{display:flex;flex-direction:column;gap:16px;padding-top:16px;}

.sr-ic{flex:none;display:flex;align-items:center;justify-content:center;width:16px;height:19px;color:var(--accent-ink);font-weight:700;}
.sr-res{overflow:auto;padding:4px 8px 12px;}
.sr-g{display:flex;align-items:center;gap:8px;padding:14px 10px 6px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--text3);}

<script>

// Time-tracking defaults (seconds). Editable live from the Demo controls drawer.
const CFG_DEFAULT = {idleAfter:180, promptWait:120, hb:120};
let CFG = Object.assign({}, CFG_DEFAULT);
const MOD_SEES_OWN_TIME = true;     // assumption: moderator sees own active-time chip. Set false to hide.
const LOCK_KEY = 'atlas_clock_lock', LOCK_TTL = 6000;
const OUTBOX_KEY = 'atlas_outbox_v1', DB_KEY = 'atlas_demo_v1';
const PAUSED_STALE_MIN = 30;        // a paused (idle) live segment is only auto-closed after this many minutes

// ── SMALL HELPERS ────────────────────────────────────────────────────────────
function uid(p){ return (p||'id-') + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function iso(ms){ return new Date(ms).toISOString(); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function fmtDur(secs){
  secs = Math.round(Number(secs)||0);
  if(secs <= 0) return '0m';
  const h = Math.floor(secs/3600), m = Math.floor((secs%3600)/60), s = secs%60;
  if(h > 0) return h + 'h ' + (m<10?'0':'') + m + 'm';
  if(m === 0) return s + 's';
  return s > 0 ? m + 'm ' + s + 's' : m + 'm';
}
function fmtClock(secs){
  secs = Math.max(0, Math.round(secs));
  const h = Math.floor(secs/3600), m = Math.floor((secs%3600)/60), s = secs%60;
  const p = n => (n<10?'0':'') + n;
  return (h>0 ? h + ':' + p(m) : p(m)) + ':' + p(s);
}
function fmtDT(s){
  if(!s) return '';
  const d = new Date(s); if(isNaN(d)) return '';
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' ' + d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
}
function todayStr(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function modTitle(id){ if(id==='final') return 'Final assessment'; const m = ATLAS_MODULES.find(x=>x.id===id); return m ? m.title : id; }
function modIdx(id){ return ATLAS_MODULES.findIndex(x=>x.id===id); }
function csvCell(v){ v = (v==null?'':String(v)); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }
function downloadCSV(name, rows){
  const csv = rows.map(r => r.map(csvCell).join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

// ── PROGRESS ROW (14-column schema from the time-tracking spec) ─────────────
// StaffId, Module, Type, Attempt, Score, Duration_s, IdleSeconds, StartTime, EndTime, ReceivedTime,
// SegmentId, VisitType, Status, Closure.   Type: module | quiz | final | certified | grant.
const ROW_COLS = ['StaffId','Module','Type','Attempt','Score','Duration_s','IdleSeconds','StartTime','EndTime','ReceivedTime','SegmentId','VisitType','Status','Closure'];
function mkRow(o){
  return {
    StaffId:o.email, Module:o.module, Type:o.type, Attempt:(o.attempt==null?'':o.attempt), Score:(o.score==null?'':o.score),
    Duration_s:Math.round(o.dur||0), IdleSeconds:Math.round(o.idle||0), StartTime:o.start, EndTime:o.end,
    ReceivedTime:o.received || iso(new Date(o.end).getTime() + 1500),
    SegmentId:o.seg, VisitType:o.visit||'initial', Status:o.status, Closure:o.closure||'clean'
  };
}

// ── SEED DATA (demo history so the admin and moderator views have something to show) ──
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed>>>15, 1|seed); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296; }; }
function buildSeedRows(){
  const R = rng(20261015), rows = [], now = Date.now(); let n = 0;
  const nid = () => 'seed-' + (++n);
  const MIN = 60;
  function put(email, t, o){
    const end = t + o.dur*1000;
    rows.push(mkRow({email, module:o.module, type:o.type, attempt:o.attempt, score:o.score, dur:o.dur, idle:o.idle||0,
      start:iso(t), end:iso(end), seg:nid(), visit:o.visit||'initial', status:o.status, closure:o.closure||'clean', received:o.received}));
    return end;
  }
  function person(email, daysAgo, sp){
    let t = now - daysAgo*864e5 - (R()*3600e3|0);
    const gap = () => (20 + R()*70) * 1000;
    const ids = ATLAS_MODULES.map(m=>m.id);
    const done = sp.done || 0;
    for(let i = 0; i < done; i++){
      const m = ATLAS_MODULES[i], id = m.id;
      const read = Math.round((m.gate==='none' ? 150 : 240 + R()*420));
      const idle = (sp.idle && sp.idle[id]) || 0;
      const rec = sp.recovered && sp.recovered.indexOf(id) >= 0;
      if(m.gate === 'none'){
        t = put(email, t, {module:id, type:'module', attempt:1, dur:read, idle, status:'completed'}) + gap();
      } else {
        const lastReadStart = t;
        t = put(email, t, {module:id, type:'module', attempt:1, dur:rec ? Math.round(read*0.55) : read, idle,
          status: rec ? 'recovered' : 'moved_to_check', closure: rec ? 'recovered' : 'clean'}) + gap();
        if(sp.longMod === id){ t = put(email, t, {module:id, type:'module', attempt:2, dur:78*MIN, status:'left'}) + gap(); }
        let attempt = 1;
        if(sp.retryMid && sp.retryMid.indexOf(id) >= 0){
          t = put(email, t, {module:id, type:'quiz', attempt:attempt++, score:'', dur:100 + Math.round(R()*100), status:'incomplete'}) + gap();
        }
        const fts = [100, 83, 83, 100, 100, 83, 83][i % 7];
        if(sp.failFirst && sp.failFirst.indexOf(id) >= 0){ t = put(email, t, {module:id, type:'quiz', attempt:attempt++, score:50, dur:150 + Math.round(R()*100), status:'failed'}) + gap(); }
        t = put(email, t, {module:id, type:'quiz', attempt:attempt++, score:fts, dur:200 + Math.round(R()*260), status:'completed'}) + gap();
        if(sp.overlapMod === id){
          // a second segment that starts 40s after the previous one ended its read: devices open at once
          put(email, lastReadStart + 40000, {module:id, type:'module', attempt:3, dur:150, visit:'review', status:'left'});
        }
      }
    }
    // current partly read module
    if(sp.partial){
      t = put(email, t, {module:sp.partial.id, type:'module', attempt:1, dur:sp.partial.sec, status:'left'}) + gap();
    }
    // review visits
    (sp.review || []).forEach(rv => {
      t += 3600e3 * (2 + R()*6);
      const mm = ATLAS_MODULES.find(x=>x.id===rv[0]);
      t = put(email, t, {module:rv[0], type:'module', attempt:9, dur:rv[1], visit:'review', status:'left'}) + gap();
      if(mm && mm.gate==='check' && rv[2]){
        t = put(email, t, {module:rv[0], type:'quiz', attempt:9, score:rv[2], dur:180, visit:'review', status:'completed'}) + gap();
      }
    });
    // finals
    (sp.finals || []).forEach((f, k) => {
      if(sp.grantAfter === k){
        t += 3600e3 * 5;
        rows.push(mkRow({email, module:'final', type:'grant', attempt:'', score:1, dur:0, idle:0, start:iso(t), end:iso(t), seg:nid(), status:'granted:test.admin@centific.com'}));
      }
      t += 3600e3 * (3 + R()*10);
      const ok = f.pct >= FINAL_PASS_PCT;
      t = put(email, t, {module:'final', type:'final', attempt:k+1, score:f.pct, dur:f.sec, idle:f.idle||0, status: ok ? 'passed' : 'failed', received: f.skew ? iso(t + f.sec*1000 + 26*60e3) : undefined}) + gap();
      if(ok) rows.push(mkRow({email, module:'final', type:'certified', attempt:'', score:f.pct, dur:0, idle:0, start:iso(t), end:iso(t), seg:nid(), status:'passed'}));
    });
  }
  person('priya.raman@centific.com', 12, {done:ATLAS_MODULES.length, recovered:['workflow'], failFirst:['comms'], review:[['safety',300,100],['hours',180],['fundamentals',420,83]], finals:[{pct:70,sec:2100,idle:120},{pct:90,sec:1950}]});
  person('marcus.webb@centific.com', 9, {done:ATLAS_MODULES.length, idle:{workflow:240}, overlapMod:'tracker', finals:[{pct:60,sec:1800},{pct:68,sec:1900,idle:300},{pct:73,sec:2050}]});
  person('hannah.brooks@centific.com', 14, {done:ATLAS_MODULES.length, review:[['comms',260]], finals:[{pct:65,sec:2000},{pct:70,sec:2100},{pct:75,sec:1990},{pct:93,sec:2200}], grantAfter:3});
  person('devon.okafor@centific.com', 6, {done:ATLAS_MODULES.length, longMod:'fundamentals', finals:[{pct:75,sec:2250}]});
  person('elena.rossi@centific.com', 3, {done:4, idle:{fundamentals:180}, retryMid:['workflow'], partial:{id:'tracker',sec:200}});
  person('aiko.tanaka@centific.com', 1, {done:2});
  // one clock-mismatch example (server receive time far from device end time)
  const e = rows.filter(r=>r.StaffId==='elena.rossi@centific.com' && r.Type==='quiz' && r.Status==='completed')[0];
  if(e) e.ReceivedTime = iso(new Date(e.EndTime).getTime() + 31*60e3);
  return rows;
}
function buildSeedMileage(){
  const d = n => iso(Date.now() - n*864e5).slice(0,10);
  return [
    {id:'m-seed-1', email:'priya.raman@centific.com', name:'Priya Raman', date:d(8), from:'Home', to:'Las Vegas Lab', miles:18.4, notes:'Lab setup day', submitted:iso(Date.now()-8*864e5)},
    {id:'m-seed-2', email:'priya.raman@centific.com', name:'Priya Raman', date:d(5), from:'Las Vegas Lab', to:'Participant site, Henderson', miles:12.1, notes:'', submitted:iso(Date.now()-5*864e5)},
    {id:'m-seed-3', email:'marcus.webb@centific.com', name:'Marcus Webb', date:d(4), from:'Home', to:'Las Vegas Lab', miles:9.6, notes:'', submitted:iso(Date.now()-4*864e5)},
    {id:'m-seed-4', email:'hannah.brooks@centific.com', name:'Hannah Brooks', date:d(2), from:'Home', to:'Las Vegas Lab', miles:22.0, notes:'Round trip counted once', submitted:iso(Date.now()-2*864e5)}

// ── STORAGE ADAPTER (demo) ───────────────────────────────────────────────────
// One layer, six calls the app uses: startSegment, heartbeat, endSegment, fetchProgress, saveRow, grantAttempts.
// Everything else on Store is demo-only helpers (users, mileage, settings, recovery sweep, reset).
// Demo adapter persists to this browser's localStorage. Nothing leaves the browser.
let DB = null;
function freshDB(){ return {v:1, users:DEMO_DIRECTORY.map(u=>Object.assign({},u)), rows:buildSeedRows(), live:{}, mileage:buildSeedMileage(), settings:{reviewPaid:false}, faq:buildSeedFaq()}; }
function persistDB(){ try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }catch(e){} }
function syncDB(){
  try{ const raw = localStorage.getItem(DB_KEY); if(raw){ DB = JSON.parse(raw); if(!DB.faq){ DB.faq = buildSeedFaq(); persistDB(); } return; } }catch(e){}
  if(!DB){ DB = freshDB(); persistDB(); }
}
let SESSION_ID = uid('s-');

const Store = {
  failures:0,   // demo control: next N row saves fail, to exercise the held-and-re-sent path
  async fetchProgress(){ syncDB(); return JSON.parse(JSON.stringify(DB.rows)); },
  async saveRow(row){
    if(this.failures > 0){ this.failures--; throw new Error('Simulated save failure'); }
    syncDB();
    const r = Object.assign({}, row); if(!r.ReceivedTime) r.ReceivedTime = iso(Date.now());
    if(!DB.rows.some(x => x.SegmentId===r.SegmentId && x.Closure===r.Closure)) DB.rows.push(r);
    persistDB(); return r;
  },
  async startSegment(live){ syncDB(); DB.live[live.SegmentId] = Object.assign({}, live); persistDB(); },
  async heartbeat(live){ syncDB(); DB.live[live.SegmentId] = Object.assign({}, DB.live[live.SegmentId]||{}, live); persistDB(); },
  async endSegment(row){ await this.saveRow(row); syncDB(); delete DB.live[row.SegmentId]; persistDB(); },
  async grantAttempts(email, n, by){
    const t = iso(Date.now());
    return this.saveRow(mkRow({email, module:'final', type:'grant', attempt:'', score:n, dur:0, idle:0, start:t, end:t, seg:uid('grant-'), status:'granted:' + by}));
  },
  // demo helpers
  async users(){ syncDB(); return JSON.parse(JSON.stringify(DB.users)); },
  async saveUsers(u){ syncDB(); DB.users = u; persistDB(); },
  async listMileage(){ syncDB(); return JSON.parse(JSON.stringify(DB.mileage)); },
  async addMileage(m){ syncDB(); DB.mileage.push(m); persistDB(); },
  async getSettings(){ syncDB(); return JSON.parse(JSON.stringify(DB.settings)); },
  async setSetting(k, v){ syncDB(); DB.settings[k] = v; persistDB(); },
  async listAttemptSets(){ syncDB(); return JSON.parse(JSON.stringify(DB.attemptSets || [])); },
  async saveAttemptSet(r){ syncDB(); DB.attemptSets = DB.attemptSets || []; DB.attemptSets.push(JSON.parse(JSON.stringify(r))); persistDB(); },
  async listFaq(){ syncDB(); return JSON.parse(JSON.stringify(DB.faq)); },
  async saveFaq(l){ syncDB(); DB.faq = JSON.parse(JSON.stringify(l)); persistDB(); },
  async markAbandoned(segId){ syncDB(); if(DB.live[segId]){ DB.live[segId].Abandoned = true; persistDB(); } },
  async listLive(){ syncDB(); return Object.values(DB.live); },
  async _recover(test){
    syncDB(); let n = 0;
    Object.keys(DB.live).forEach(id => {
      const l = DB.live[id]; if(!test(l)) return;
      DB.rows.push(mkRow({email:l.StaffId, module:l.Module, type:l.Type, attempt:l.Attempt, score:'', dur:l.Active||0, idle:l.Idle||0,
        start:l.StartTime, end:iso(l.hbAt), seg:l.SegmentId, visit:l.VisitType, status:'recovered', closure:'recovered', received:iso(Date.now())}));
      delete DB.live[id]; n++;
    });
    if(n) persistDB(); return n;
  },
  // On next app open (any device): close this person's abandoned segments from the last checkpoint.
  async recoverOwn(email, sid){
    const now = Date.now();
    return this._recover(l => l.StaffId===email && l.SessionId!==sid && (l.Closing || l.Abandoned || now - l.hbAt > CFG.hb*2000));
  },
  // Scheduled cleanup stand-in: no heartbeat for 3 intervals (a paused/idle segment gets a much longer grace).
  async recoverStale(sid){
    const now = Date.now();
    return this._recover(l => l.SessionId!==sid && (l.Paused ? now - l.hbAt > PAUSED_STALE_MIN*60000 : now - l.hbAt > CFG.hb*3000));
  },
  async reset(){ DB = freshDB(); persistDB(); try{ localStorage.removeItem(OUTBOX_KEY); localStorage.removeItem(LOCK_KEY); }catch(e){} }
};

// Failed saves are held in the browser and re-sent on next open (spec item 11).
function outboxGet(){ try{ return JSON.parse(localStorage.getItem(OUTBOX_KEY)||'[]'); }catch(e){ return []; } }
function outboxSet(a){ try{ localStorage.setItem(OUTBOX_KEY, JSON.stringify(a)); }catch(e){} }
function outboxPush(r){ const a = outboxGet(); a.push(r); outboxSet(a); }
async function flushOutbox(){
  const q = outboxGet(); if(!q.length) return 0;
  const keep = [];
  for(const r of q){ try{ await Store.endSegment(r); }catch(e){ keep.push(r); } }
  outboxSet(keep);
  if(keep.length !== q.length){ ROWS = await Store.fetchProgress(); }
  return q.length - keep.length;
}

// ── DERIVED STATE (everything computed fresh from rows; nothing cached) ─────
// Idempotent totals: each SegmentId counts once, a clean row wins over a recovered one.
function dedupe(rows){
  const m = new Map();
  rows.forEach(r => { const p = m.get(r.SegmentId); if(!p || (p.Closure==='recovered' && r.Closure==='clean')) m.set(r.SegmentId, r); });
  return Array.from(m.values());
}
const LONG_LIMIT = {module:3600, quiz:2400, final:5400};
function computeUser(email){
  const all = dedupe(ROWS.filter(r => r.StaffId === email)).sort((a,b) => a.StartTime < b.StartTime ? -1 : a.StartTime > b.StartTime ? 1 : 0);
  const timed = all.filter(r => r.Type==='module' || r.Type==='quiz' || r.Type==='final');
  const done = new Set(all.filter(r => (r.Type==='module' || r.Type==='quiz') && r.Status==='completed').map(r => r.Module));
  const finals = all.filter(r => r.Type==='final' && (r.Status==='passed' || r.Status==='failed'));
  const grants = all.filter(r => r.Type==='grant').reduce((s,r) => s + (Number(r.Score)||0), 0);
  const passedRow = finals.find(r => r.Status === 'passed');
  const allowance = FINAL_MAX_ATTEMPTS + grants;
  const doneCount = ATLAS_MODULES.filter(m => done.has(m.id)).length;
  const allDone = doneCount === ATLAS_MODULES.length;
  const certified = allDone && !!passedRow;
  const locked = allDone && !passedRow && finals.length >= allowance;
  let status = 'not_started';
  if(timed.length || doneCount) status = 'in_progress';
  if(allDone && !certified) status = locked ? 'locked' : 'awaiting_final';
  if(certified) status = 'certified';
  const sum = (arr, f) => arr.reduce((s,r) => s + (Number(r[f])||0), 0);
  const initialT = sum(timed.filter(r => r.VisitType==='initial' && r.Type!=='final'), 'Duration_s');
  const reviewT = sum(timed.filter(r => r.VisitType==='review'), 'Duration_s');
  const finalT = sum(timed.filter(r => r.Type==='final'), 'Duration_s');
  const idleT = sum(timed, 'IdleSeconds');
  const activeT = sum(timed, 'Duration_s');
  const flagsByRow = {};
  timed.forEach(r => { flagsByRow[r.SegmentId] = rowFlags(r, timed); });
  const flagCount = Object.values(flagsByRow).reduce((s,f) => s + f.length, 0);
  const per = {};
  ATLAS_MODULES.forEach(m => { per[m.id] = {readI:0, checkI:0, review:0, attempts:0}; });
  timed.forEach(r => {
    const p = per[r.Module]; if(!p) return;
    if(r.VisitType === 'review') p.review += Number(r.Duration_s)||0;
    else if(r.Type === 'quiz') p.checkI += Number(r.Duration_s)||0;
    else p.readI += Number(r.Duration_s)||0;
    if(r.Type === 'quiz') p.attempts++;
  });
  const paidT = initialT + finalT + (SETTINGS.reviewPaid ? reviewT : 0);
  return {email, all, timed, done, finals, grants, allowance, used:finals.length, passedRow, doneCount, allDone, certified, locked, status,
          initialT, reviewT, finalT, idleT, activeT, paidT, flagsByRow, flagCount, per};
}
function rowFlags(r, timed){
  const f = [];
  if(r.Closure === 'recovered') f.push('recovered');
  const s = new Date(r.StartTime).getTime(), e = new Date(r.EndTime).getTime(), rc = new Date(r.ReceivedTime).getTime();
  if(!isNaN(rc) && !isNaN(e) && Math.abs(rc - e) > 10*60e3) f.push('clock mismatch');
  else if(!isNaN(s) && !isNaN(e) && (e - s)/1000 + 5 < (Number(r.Duration_s)||0)) f.push('clock mismatch');
  if((Number(r.Duration_s)||0) > (LONG_LIMIT[r.Type]||1e9)) f.push('unusually long');
  const overlap = timed.some(o => o.SegmentId !== r.SegmentId && new Date(o.StartTime).getTime() < e - 5000 && new Date(o.EndTime).getTime() > s + 5000);
  if(overlap) f.push('overlapping');
  return f;
}
function isDone(id){ return computeUser(ME.email).done.has(id); }
function moduleUnlocked(i){ return i === 0 || isDone(ATLAS_MODULES[i-1].id); }
function nextAttempt(email, module, type){
  return dedupe(ROWS.filter(r => r.StaffId===email && r.Module===module && r.Type===type)).length + 1;
}

// ── CLOCK (active-time tracking, spec v2: timer, activity, prompt, heartbeat, checkpoint, recovery, one clock) ──
const Clock = {
  seg:null, state:'idle', live:false, quiet:0, promptSecs:0, pending:0, nextBeat:0, hbCount:0, timer:null,
  init(){
    if(this.timer) return;
    this.timer = setInterval(() => this.tick(), 1000);
    ['pointerdown','keydown','scroll','touchstart','wheel'].forEach(ev => window.addEventListener(ev, () => this.activity(), {passive:true, capture:true}));
    document.addEventListener('visibilitychange', () => { if(document.hidden) this.checkpoint(false); });
    window.addEventListener('pagehide', () => this.checkpoint(true));
  },
  acquire(){
    try{
      const raw = localStorage.getItem(LOCK_KEY), l = raw ? JSON.parse(raw) : null, now = Date.now();
      if(l && l.sid !== SESSION_ID && now - l.ts < LOCK_TTL) return false;
      localStorage.setItem(LOCK_KEY, JSON.stringify({sid:SESSION_ID, email:ME?ME.email:'', ts:now}));
      return true;
    }catch(e){ return true; }
  },
  release(){ try{ const l = JSON.parse(localStorage.getItem(LOCK_KEY)||'null'); if(l && l.sid === SESSION_ID) localStorage.removeItem(LOCK_KEY); }catch(e){} },
  liveRec(closing){
    const s = this.seg;
    return {SegmentId:s.segId, StaffId:s.staffId, Module:s.module, Type:s.type, Attempt:s.attempt, VisitType:s.visit, StartTime:s.startTime,
      SessionId:SESSION_ID, Active:Math.max(0, s.active - (this.state==='prompt' ? this.pending : 0)), Idle:s.idle,
      hbAt:Date.now(), Paused:this.state==='paused', Closing:!!closing};
  },
  async start(spec){
    if(this.seg) await this.stop('left');
    const now = Date.now();
    this.seg = {segId:uid('seg-'), staffId:ME.email, module:spec.module, type:spec.type, attempt:spec.attempt, visit:spec.visit,
      startTime:iso(now), startMs:now, active:0, idle:0};
    this.quiet = 0; this.pending = 0; this.promptSecs = 0; this.hbCount = 0;
    this.nextBeat = Math.round(CFG.hb * (0.4 + Math.random()*0.6));   // jittered first checkpoint
    if(this.acquire()){ this.state = 'running'; this.live = true; Store.startSegment(this.liveRec(false)).catch(()=>{}); }
    else { this.state = 'blocked'; this.live = false; }
    this.paint();
  },
  activity(){
    if(!this.seg) return;
    if(this.state === 'prompt') this.confirm();
    else if(this.state === 'paused') this.resume();
    else if(this.state === 'running') this.quiet = 0;
  },
  confirm(){            // "I'm still here": the quiet time counts (reading)
    this.quiet = 0; this.pending = 0; this.promptSecs = 0; this.state = 'running'; hidePrompt(); this.paint();
  },
  resume(){             // activity after a pause
    if(!this.acquire()){ this.state = 'blocked'; this.paint(); return; }
    this.quiet = 0; this.pending = 0; this.state = 'running'; this.paint(); this.beat(false);
  },
  tick(){
    const s = this.seg; if(!s) return;
    if(this.state === 'blocked'){
      if(this.acquire()){ this.state = 'running'; this.live = true; s.startTime = iso(Date.now()); Store.startSegment(this.liveRec(false)).catch(()=>{}); }
      this.paint(); return;
    }
    if(this.live) this.acquire();                  // refresh the one-clock lock
    if(document.hidden){ updateDemoLive(); return; }   // hidden or minimized = not active
    if(this.state === 'running'){
      s.active++; this.quiet++;
      if(this.quiet >= CFG.idleAfter){ this.state = 'prompt'; this.promptSecs = 0; this.pending = this.quiet; showPrompt(); }
    } else if(this.state === 'prompt'){
      s.active++; this.promptSecs++; this.pending++;
      const el = document.getElementById('promptCount'); if(el) el.textContent = Math.max(0, CFG.promptWait - this.promptSecs);
      if(this.promptSecs >= CFG.promptWait){
        // no answer: the quiet time (since the last activity) becomes idle, and the clock pauses
        s.active = Math.max(0, s.active - this.pending); s.idle += this.pending; this.pending = 0;
        this.state = 'paused'; hidePrompt(); this.beat(false);
        toast('Timer paused: no activity. It resumes when you do something.');
      }
    }
    if((this.state === 'running' || this.state === 'prompt') && s.active >= this.nextBeat){
      this.beat(false); this.nextBeat = s.active + CFG.hb;
    }
    this.paint();
  },
  beat(closing){ if(!this.seg || !this.live) return; Store.heartbeat(this.liveRec(closing)).catch(()=>{}); this.hbCount++; },
  checkpoint(closing){ if(this.seg && this.live && this.state !== 'blocked') this.beat(closing); },
  shown(){ const s = this.seg; if(!s) return 0; return Math.max(0, s.active - (this.state==='prompt' ? this.pending : 0)); },
  paint(){
    const el = document.getElementById('clockChip');
    if(el){
      const s = this.seg;
      if(!s){ el.style.display = 'none'; }
      else {
        el.style.display = '';
        let cls = 'chip', txt = '';
        if(this.state === 'paused'){ cls += ' paused'; txt = 'Paused (idle) ' + fmtClock(this.shown()); }
        else if(this.state === 'blocked'){ cls += ' blocked'; txt = 'Not timing: Atlas is open in another tab'; }
        else txt = 'Active ' + fmtClock(this.shown());
        el.className = cls; el.innerHTML = '<span class="cd"></span>' + txt;
      }
    }
    updateDemoLive();
  },
  async stop(status, score){
    const s = this.seg; if(!s) return null;
    const wasLive = this.live;
    this.seg = null; this.state = 'idle'; this.live = false; hidePrompt(); this.release();
    if(!wasLive){ this.paint(); return null; }   // never held the clock: nothing to record
    const row = mkRow({email:s.staffId, module:s.module, type:s.type, attempt:s.attempt, score:(score==null?'':score), dur:s.active, idle:s.idle,
      start:s.startTime, end:iso(Date.now()), seg:s.segId, visit:s.visit, status, closure:'clean'});
    try{ await Store.endSegment(row); }
    catch(e){ outboxPush(row); toast('Save failed: held on this device and re-sent next time.'); }
    ROWS = await Store.fetchProgress();
    this.paint();
    return row;
  },
  // Demo only: simulate the browser closing mid-segment. withCheckpoint=true is the normal close (one last checkpoint is sent);
  // false is a crash or power loss (only the last periodic checkpoint exists).
  simulateClose(withCheckpoint){
    if(!this.seg || !this.live) return false;
    if(withCheckpoint) this.beat(true); else Store.markAbandoned(this.seg.segId);
    this.seg = null; this.state = 'idle'; this.live = false; hidePrompt(); this.release();
    SESSION_ID = uid('s-');
    return true;
  }
};
</script>
<script>
// ── LOGO (custom, nods to the project name: Atlas, the figure who carries the world; globe + meridians + compass star) ──
function logoSvg(px){
  return '<svg width="'+px+'" height="'+px+'" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'
   + '<circle cx="14" cy="14" r="9" stroke="white" stroke-width="1.6"/>'
   + '<ellipse cx="14" cy="14" rx="4" ry="9" stroke="white" stroke-width="1.3" opacity="0.85"/>'
   + '<path d="M5 14h18M6.2 9.5h15.6M6.2 18.5h15.6" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>'
   + '<path d="M22.6 1.2l1.25 3.05 3.05 1.25-3.05 1.25-1.25 3.05-1.25-3.05-3.05-1.25 3.05-1.25z" fill="white"/></svg>';
}

// ── TOAST / MODALS / PROMPT HOSTS ────────────────────────────────────────────
function toast(m){
  const t = document.getElementById('toast'); if(!t) return;
  t.textContent = m; t.classList.add('show');
  clearTimeout(window._tt); window._tt = setTimeout(() => t.classList.remove('show'), 3200);
}
function host(id){ let h = document.getElementById(id); if(!h){ h = document.createElement('div'); h.id = id; document.body.appendChild(h); } return h; }
function openModal(inner){ document.getElementById('overlays').innerHTML = '<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal">' + inner + '</div></div>'; }
function closeModal(){ document.getElementById('overlays').innerHTML = ''; }
function askConfirm(title, text, yes){
  return new Promise(resolve => {
    window._cfm = ok => { closeModal(); resolve(ok); };
    openModal('<h3>' + esc(title) + '</h3><p>' + esc(text) + '</p><div class="m-actions"><button class="btn btn-ghost" onclick="_cfm(false)">Cancel</button><button class="btn btn-primary" onclick="_cfm(true)">' + esc(yes||'Confirm') + '</button></div>');
  });
}
function showPrompt(){
  host('promptHost').innerHTML = '<div class="overlay" style="z-index:1100"><div class="modal" style="text-align:center"><h3>Still there?</h3><p>You have been quiet for a while. Confirm you are still working on this, or the timer will pause in <strong id="promptCount">' + CFG.promptWait + '</strong>s.</p><div class="m-actions" style="justify-content:center"><button class="btn btn-primary" id="stillHere" onclick="Clock.confirm()">I am still here</button></div></div></div>';
}
function hidePrompt(){ const h = document.getElementById('promptHost'); if(h) h.innerHTML = ''; }

// ── LOGIN ────────────────────────────────────────────────────────────────────
function fabHtml(){ return '<button class="demo-fab" onclick="openDemo()" title="Demo controls"><span>&#9881;</span><span class="lbl">Demo controls</span></button>'; }
function demoBar(){ return '<div class="demo-bar"><span class="dd"></span><span><strong>Demo data.</strong> Nothing is saved to a server.</span><span class="muted">' + verTag() + '</span></div>'; }
function renderLogin(){
  document.getElementById('app').innerHTML = demoBar() + '<div id="login"><div class="entry-card">'
    + '<div class="brand-mark">' + logoSvg(30) + '</div>'
    + '<div class="eyebrow">CENTIFIC &middot; PROJECT ATLAS</div>'
    + '<div class="entry-title">Moderator Onboarding</div>'
    + '<div class="entry-sub">Training and certification for Project Atlas moderators.</div>'
    + '<label class="field-label" for="emailField">Centific email</label>'
    + '<input class="field-input" id="emailField" type="email" autocomplete="off" placeholder="name@centific.com" onkeydown="if(event.key===\'Enter\')doLogin()">'
    + '<div class="err-msg" id="lgErr"></div>'
    + '<button class="btn btn-primary" style="margin-top:6px" onclick="doLogin()">Continue &rarr;</button>'
    + '<div class="hint-line">Demo accounts: <strong>test.mod@centific.com</strong> (moderator), <strong>test.admin@centific.com</strong> (admin).</div>'
    + '<div class="version-tag">' + verTag() + '</div></div></div>' + fabHtml();
}
function findUser(email){ return DIR.find(r => r.email === email.toLowerCase()); }
async function doLogin(){
  const el = document.getElementById('emailField');
  const email = (el.value || '').trim().toLowerCase();
  const err = document.getElementById('lgErr');
  // @centific.com check comes BEFORE any directory lookup
  if(!/^[^@\s]+@centific\.com$/.test(email)){ err.textContent = 'Please enter your @centific.com email address.'; return; }
  err.textContent = '';
  await refreshAll();
  const rec = findUser(email);
  if(!rec || rec.active === 'no'){ err.textContent = "That email isn't on the moderator list yet. Check with your project coordinator."; return; }
  ME = {email:rec.email, name:rec.name, role:rec.role, cohort:rec.cohort};
  const recovered = await Store.recoverOwn(ME.email, SESSION_ID);   // close abandoned segments from the last visit
  const resent = await flushOutbox();
  await refreshAll();
  startApp(rec.role);
  if(recovered) toast('Recovered ' + recovered + ' unfinished segment' + (recovered>1?'s':'') + ' from your last visit.');
  else if(resent) toast('Re-sent ' + resent + ' held save' + (resent>1?'s':'') + '.');
}
async function logout(){
  if(!(await safeLeave())) return;
  ME = null; ROLE = null; closeModal(); renderLogin();
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const nx = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', nx);
  try{ localStorage.setItem('atlas_theme', nx); }catch(e){}
}

// ── SHELL ────────────────────────────────────────────────────────────────────
function startApp(role){
  ROLE = role; VIEW = role === 'admin' ? 'dash' : 'path'; QZ = freshQZ(); FIN = {mode:'idle', idx:0, ans:{}, result:null};
  document.getElementById('app').innerHTML = demoBar() + '<div class="shell"><div class="page-wrap">'
    + '<div class="app-header"><div class="nav-left"><div class="nav-logo">' + logoSvg(18) + '</div>'
    + '<div class="nav-brand">Project <strong style="color:var(--accent-ink);font-weight:600">Atlas</strong> <span>&middot; Onboarding</span></div></div>'
    + '<div class="nav-right"><div class="who-text"><span>' + esc(ME.name) + '</span><br><span class="role-line">' + (role==='admin' ? 'Admin' : 'Moderator') + '</span></div>'
    + '<button class="srch-btn" onclick="openSearch()" aria-label="Search">' + SEARCH_SVG + '<span>Search</span><kbd>' + srKbd() + '</kbd></button>'
    + '<button class="icon-btn" onclick="toggleTheme()" title="Theme" aria-label="Toggle theme">&#9680;</button>'
    + '<button class="btn-signout" onclick="logout()"><span aria-hidden="true">&#9099;</span>Sign out</button></div></div>'
    + '<div class="nav-tabs" id="navTabs"></div><main class="content" id="content"></main></div></div>' + fabHtml();
  renderNavTabs(); renderView();
}
async function switchView(v){
  if(!(await safeLeave())) return;
  VIEW = v; if(v === 'path'){ QZ = freshQZ(); FIN = {mode:'idle', idx:0, ans:{}, result:null}; }
  await refreshAll(); renderNavTabs(); renderView(); window.scrollTo(0,0);
}
function renderNavTabs(){
  const tabs = ROLE === 'admin'
    ? [['dash','Dashboard'],['mods','Moderators'],['mileage','Mileage'],['curriculum','Curriculum']]
    : [['path','Learning Path'],['resources','Resources'],['mileage','Mileage']];
  const active = (VIEW==='module'||VIEW==='final') ? 'path' : (VIEW==='detail' ? 'mods' : (VIEW==='faq' ? 'resources' : VIEW));
  document.getElementById('navTabs').innerHTML = tabs.map(t => '<button class="nav-tab' + (active===t[0]?' active':'') + '" onclick="switchView(\'' + t[0] + '\')">' + t[1] + '</button>').join('');
}
function renderView(){
  const c = document.getElementById('content'); if(!c) return;
  const f = {path:vPath, module:vModule, final:vFinal, mileage:vMileage, resources:vResources, faq:vFaq, dash:vDash, curriculum:vCurriculum, mods:vMods, detail:vModDetail}[VIEW];
  c.innerHTML = f ? f() : '';
  Clock.paint();
}
function chipHtml(){ return (ROLE==='moderator' && MOD_SEES_OWN_TIME) ? '<span id="clockChip" class="chip" style="display:none"></span>' : ''; }
function freshQZ(){ return {mod:null, idx:0, ans:{}, wrong:{}, ft:{}, wp:0, started:false, finished:false, score:null, attempt:0}; }

// ── LEAVING A TIMED SEGMENT ──────────────────────────────────────────────────
async function leaveSegment(){
  if(!Clock.seg) return;
  const t = Clock.seg.type;
  await Clock.stop(t === 'quiz' ? 'incomplete' : t === 'final' ? 'abandoned' : 'left');
}
async function safeLeave(){
  if(Clock.seg && Clock.seg.type === 'final'){
    const ok = await askConfirm('Leave the final assessment?', 'This attempt will not be scored and will not count as used. The time so far is still recorded.', 'Leave');
    if(!ok) return false;
  }
  await leaveSegment();
  return true;
}

// ── LEARNING PATH ────────────────────────────────────────────────────────────
function ring(pct){
  const r = 38, c = 2*Math.PI*r;
  return '<div class="ring"><svg width="92" height="92" viewBox="0 0 92 92"><circle cx="46" cy="46" r="'+r+'" fill="none" stroke="var(--bg4)" stroke-width="8"/><circle cx="46" cy="46" r="'+r+'" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-pct/100))+'"/></svg><div class="ring-num">'+pct+'%</div></div>';
}
function contactLine(){ if(!LOCKOUT_CONTACT.email) return '<strong>' + esc(LOCKOUT_CONTACT.name) + '</strong>'; return '<strong>' + esc(LOCKOUT_CONTACT.name) + '</strong> (<a href="mailto:' + esc(LOCKOUT_CONTACT.email) + '">' + esc(LOCKOUT_CONTACT.email) + '</a>)'; }
function vPath(){
  const u = computeUser(ME.email), total = ATLAS_MODULES.length;
  const pct = Math.round(u.doneCount / total * 100), first = ME.name.split(' ')[0];
  const totalMin = ATLAS_MODULES.reduce((s,m) => s + m.min, 0);
  let cls = 'hero-box', main;
  const tl = MOD_SEES_OWN_TIME && u.activeT > 0 ? '<div class="progress-label" style="margin-top:6px">Active training time so far: ' + fmtDur(u.activeT) + '</div>' : '';
  if(u.certified){
    cls += ' certified';
    main = '<div class="pill pill-green" style="margin-bottom:10px">&#10003; Certified</div><div class="hero-title2">You are certified, ' + esc(first) + '.</div><div class="hero-sub2">All ' + total + ' modules are complete and the final assessment was passed at ' + u.passedRow.Score + '%. Your coordinator will confirm next steps.</div>' + tl;
  } else if(u.locked){
    cls += ' locked';
    main = '<div class="pill pill-red" style="margin-bottom:10px">Final assessment locked</div><div class="hero-title2">You have used all ' + u.allowance + ' attempts.</div><div class="hero-sub2">An admin reviews every case and can grant an extra attempt. Contact ' + contactLine() + '.</div><button class="btn btn-secondary" style="width:auto" onclick="openFinal()">See details</button>' + tl;
  } else if(u.allDone){
    main = '<div class="hero-title2">One step left, ' + esc(first) + '.</div><div class="hero-sub2">All ' + total + ' modules are complete. Pass the final assessment (' + FINAL_PASS_PCT + '%, ' + (u.allowance - u.used) + ' of ' + u.allowance + ' attempts left) to be certified.</div><button class="btn btn-primary" style="width:auto" onclick="openFinal()">Take the final assessment &rarr;</button>' + tl;
  } else if(u.doneCount === 0){
    main = '<div class="hero-title2">Welcome, ' + esc(first) + '. Let us get you ready.</div><div class="hero-sub2">' + total + ' modules in order, about ' + totalMin + ' minutes in total, then a final assessment. Every module stays open for review once complete.</div>' + tl;
  } else {
    main = '<div class="hero-title2">Welcome back, ' + esc(first) + '.</div><div class="hero-sub2">Pick up where you left off.</div><div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div><div class="progress-label">' + u.doneCount + ' of ' + total + ' modules complete</div>' + tl;
  }
  const steps = ATLAS_MODULES.map((m,i) => {
    const done = u.done.has(m.id), unlocked = i === 0 || u.done.has(ATLAS_MODULES[i-1].id), current = unlocked && !done;
    const dot = done ? 'done' : current ? 'current' : 'locked';
    return '<div class="step-row' + (unlocked?' clickable':'') + '"' + (unlocked ? ' onclick="openModule(' + i + ')"' : '') + '><div class="step-dot ' + dot + '">' + (done ? '&#10003;' : (i+1)) + '</div><div class="step-body"><div class="step-title' + (unlocked?'':' locked') + '">' + m.ic + ' ' + esc(m.title) + '</div><div class="step-meta">' + (unlocked ? ('~' + m.min + ' min &middot; ' + (done ? 'Completed' : current ? 'Up next' : '') + (m.gate==='check' ? ' &middot; knowledge check' : '')) : 'Locked: complete the previous module') + '</div></div></div>';
  }).join('');
  const fd = u.certified ? 'done' : u.locked ? 'bad' : u.allDone ? 'current' : 'locked';

// ── KNOWLEDGE CHECK (Sesame logic: one question at a time, a wrong pick lets you try again; retry resets and is timed) ──
function quizReviewHtml(qs){
  return qs.map((q, i) => {
    const pk = QZ.ans[i], ok = pk === q.a;
    return '<div class="quiz-card" style="margin-top:10px"><div class="quiz-progress">Question ' + (i+1) + ' of ' + qs.length + ' <span class="pill pill-sm ' + (ok ? 'pill-green' : 'pill-red') + '">' + (ok ? '&#10003; Correct' : '&#10007; Incorrect') + '</span></div><div class="quiz-q">' + q.q + '</div>'
      + '<div class="quiz-opt ' + (ok ? 'correct' : 'incorrect') + '" style="cursor:default">' + (pk !== undefined ? q.opts[pk] : '') + '</div>'
      + (!ok && REVIEW_SHOWS_CORRECT_ANSWER.check ? '<div class="quiz-opt correct" style="cursor:default"><span class="muted">Correct answer:</span> ' + q.opts[q.a] + '</div>' : '') + '</div>';
  }).join('');
}
function renderQuiz(m, done){
  const qs = (QZ.started && QZ.set) ? QZ.set : getModQuestions(m.id);
  if(!qs.length) return '<div class="stub-gate"><div class="locked-note">No questions are defined for this module yet.</div></div>';
  const att = QZ.attempt || '';
  if(!QZ.started){
    return '<div class="quiz-card"><div class="quiz-progress">Knowledge check &middot; ' + qs.length + ' questions ' + (done ? '<span class="pill pill-green pill-sm">&#10003; Completed</span>' : '') + '</div>'
      + '<div class="quiz-q" style="margin-bottom:8px">' + (done ? 'Take the check again as a refresher.' : 'Ready to check what you learned?') + '</div>'
      + '<p class="muted" style="font-size:13.5px;line-height:1.55;margin:0 0 16px">One question at a time. ' + (CHECK_MODE === 'lenient' ? 'A wrong pick lets you try again, but only your first pick counts toward the score.' : '<strong>Once you select an answer it is locked.</strong> To change an answer you have to retry the whole check.') + (CHECK_PASS_PCT > 0 ? ' You need ' + CHECK_PASS_PCT + '% to pass and can retry as often as you like.' : ' There is no pass mark on module checks. Your score is recorded, and you can retry as often as you like.') + ' Every attempt is timed on its own.' + (done ? ' Time on a repeat is logged as review.' : '') + '</p>'
      + '<button class="btn btn-primary" style="width:auto" onclick="startQuiz()">' + (done ? 'Retry the check' : 'Start knowledge check') + ' &rarr;</button> ' + lastQuizBtn(m.id) + '</div>';
  }
  if(QZ.finished){
    if(QZ.review) return '<div class="quiz-card"><div class="quiz-progress">Knowledge check &middot; attempt ' + att + ' &middot; review</div><div class="quiz-q">Your answers: ' + QZ.score + '%</div><button class="btn btn-secondary" style="width:auto" onclick="QZ.review=false;renderView()">&larr; Back to result</button></div>' + quizReviewHtml(qs);
    const pass = QZ.score >= CHECK_PASS_PCT;
    return '<div class="quiz-card"><div class="quiz-progress">Knowledge check &middot; attempt ' + att + ' &middot; ' + (pass ? '<span class="pill pill-green pill-sm">&#10003; Passed</span>' : '<span class="pill pill-red pill-sm">Not yet</span>') + '</div>'
      + '<div class="quiz-q">' + (pass ? 'Check complete.' : 'Not quite there yet.') + ' Score: ' + QZ.score + '%</div>'
      + '<p class="muted" style="font-size:13.5px;margin:0 0 16px">' + (qs.length - QZ.wp) + ' of ' + qs.length + ' correct. ' + (pass ? 'You can review your answers, retry to reset the questions, or move on.' : CHECK_PASS_PCT + '% is needed to complete this module. Review your answers, then retry the check.') + '</p>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-secondary" onclick="QZ.review=true;renderView()">Review answers</button><button class="btn ' + (pass ? 'btn-secondary' : 'btn-primary') + '" style="width:auto" onclick="retryQuiz()">&#8635; Retry the check</button></div></div>';
  }
  const idx = QZ.idx, q = qs[idx], pk = QZ.ans[idx], answered = pk !== undefined, jw = QZ.wrong[idx];
  const allAnswered = qs.every((_, i) => QZ.ans[i] !== undefined);
  const dots = qs.map((_, i) => { const a = QZ.ans[i] !== undefined; return '<div class="quiz-dot' + (i===idx?' active':'') + (a?' answered':'') + '"' + (a ? ' onclick="jumpQ(' + i + ')" style="cursor:pointer"' : '') + '></div>'; }).join('');
  const opts = q.opts.map((o, oi) => {
    let c = 'quiz-opt';
    if(answered){
      if(oi === pk) c += (pk === q.a ? ' correct' : ' incorrect');
      else if(pk !== q.a && REVIEW_SHOWS_CORRECT_ANSWER.check && oi === q.a) c += ' correct';
    } else if(jw === oi) c += ' incorrect';
    return answered ? '<div class="' + c + '" style="cursor:default">' + o + '</div>' : '<button class="' + c + '" onclick="answerQuiz(' + idx + ',' + oi + ')">' + o + '</button>';
  }).join('');
  let fb = '';
  if(answered) fb = pk === q.a ? '<div class="quiz-fb correct">&#10003; Correct.</div>' : '<div class="quiz-fb incorrect">&#10007; Incorrect. This answer is locked. Retry the check to try again.</div>';
  else if(jw !== undefined) fb = '<div class="quiz-fb incorrect">&#10007; Not quite. Give it another try.</div>';
  const back = idx > 0 ? '<button class="btn btn-ghost" style="width:auto;margin-top:14px" onclick="prevQ()">&larr; Back</button>' : '';
  const nav = idx < qs.length - 1
    ? '<button class="btn btn-secondary" style="width:auto;margin-top:14px"' + (answered ? '' : ' disabled') + ' onclick="nextQ()">Next question &rarr;</button>'
    : '<button class="btn btn-primary" style="width:auto;margin-top:14px"' + (allAnswered ? '' : ' disabled') + ' onclick="finishQuiz()">Finish check &rarr;</button>';
  return '<div class="quiz-card"><div class="quiz-progress">Knowledge check &middot; question ' + (idx+1) + ' of ' + qs.length + ' &middot; attempt ' + att + '</div>'
    + '<div class="quiz-dots">' + dots + '</div><div class="quiz-q">' + q.q + '</div>' + opts + fb
    + '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">' + back + nav + '<button class="btn btn-ghost" style="width:auto;margin-top:14px;margin-left:auto" onclick="retryQuiz()" title="Reset the questions and start this check again">&#8635; Retry (reset)</button></div></div>';
}
async function startQuiz(){
  const m = ATLAS_MODULES[CUR_MOD], visit = isDone(m.id) ? 'review' : 'initial';
  await Clock.stop('moved_to_check');            // end the reading segment, start the attempt segment
  QZ = freshQZ(); QZ.mod = m.id; QZ.started = true; QZ.attempt = nextAttempt(ME.email, m.id, 'quiz'); QZ.set = modDraw(m.id, ME.email, QZ.attempt);
  renderView();
  await Clock.start({module:m.id, type:'quiz', attempt:QZ.attempt, visit});
  renderView();
}
async function retryQuiz(){
  const m = ATLAS_MODULES[CUR_MOD];
  if(QZ.started && !QZ.finished) await Clock.stop('incomplete');    // reset mid-attempt: that attempt is logged incomplete
  else await Clock.stop('left');                                     // retry after finishing: close the review-reading segment
  await refreshAll();
  const visit = isDone(m.id) ? 'review' : 'initial';
  QZ = freshQZ(); QZ.mod = m.id; QZ.started = true; QZ.attempt = nextAttempt(ME.email, m.id, 'quiz'); QZ.set = modDraw(m.id, ME.email, QZ.attempt);
  renderView();
  await Clock.start({module:m.id, type:'quiz', attempt:QZ.attempt, visit});
  renderView(); toast('Questions reset. New attempt started.');
}
function answerQuiz(qi, oi){
  const q = (QZ.set || getModQuestions(ATLAS_MODULES[CUR_MOD].id))[qi];
  if(QZ.ans[qi] !== undefined) return;
  if(CHECK_MODE === 'lenient'){
    // lenient (Sesame style): keep picking until correct, only the first pick is scored
    if(QZ.ft[qi] === undefined) QZ.ft[qi] = (oi === q.a);
    if(oi === q.a){ QZ.ans[qi] = oi; delete QZ.wrong[qi]; } else { QZ.wrong[qi] = oi; QZ.wp++; }
  } else {
    // strict: the answer locks on selection
    QZ.ans[qi] = oi; QZ.ft[qi] = (oi === q.a); if(oi !== q.a) QZ.wp++;
  }
  renderView();
}
function nextQ(){ QZ.idx = Math.min((QZ.set || getModQuestions(ATLAS_MODULES[CUR_MOD].id)).length - 1, QZ.idx + 1); renderView(); }
function prevQ(){ QZ.idx = Math.max(0, QZ.idx - 1); renderView(); }
function jumpQ(i){ if(QZ.ans[i] !== undefined){ QZ.idx = i; renderView(); } }
async function finishQuiz(){
  const m = ATLAS_MODULES[CUR_MOD], qs = QZ.set || getModQuestions(m.id);
  const ok = qs.filter((_, i) => QZ.ft[i] === true).length;
  const score = Math.round(ok / qs.length * 100), pass = score >= CHECK_PASS_PCT;
  await Clock.stop(pass ? 'completed' : 'failed', score);
  QZ.finished = true; QZ.score = score; QZ.review = false;
  LASTQZ[m.id] = {set:QZ.set, ans:Object.assign({}, QZ.ans), ft:Object.assign({}, QZ.ft), wp:QZ.wp, score:score, attempt:QZ.attempt};
  toast(pass ? 'Module complete.' : 'Not passed yet. Review your answers and retry.'); renderView();
  // after a pass the module is complete, so further time here is review; after a fail the module is still initial
  await refreshAll();
  await Clock.start({module:m.id, type:'module', attempt:nextAttempt(ME.email, m.id, 'module'), visit:isDone(m.id) ? 'review' : 'initial'});
}

function answerFinal(oi){ if(FIN.ans[FIN.idx] !== undefined) return; FIN.ans[FIN.idx] = oi; renderView(); }
function nextFinal(){ FIN.idx = Math.min(FIN.set.length - 1, FIN.idx + 1); renderView(); }
function prevFinal(){ FIN.idx = Math.max(0, FIN.idx - 1); renderView(); }
function jumpFinal(i){ if(FIN.ans[i] !== undefined){ FIN.idx = i; renderView(); } }
async function submitFinal(){
  let correct = 0; FIN.set.forEach((q, i) => { if(FIN.ans[i] === q.a) correct++; });
  const pct = Math.round(correct / FIN.set.length * 100), pass = pct >= FINAL_PASS_PCT, attempt = FIN.attempt;
  await Clock.stop(pass ? 'passed' : 'failed', pct);
  try{ await Store.saveAttemptSet(attemptRecord(correct, pct, pass)); }catch(e){}

  }

  renderView(); window.scrollTo(0,0);
}
function lockoutBlock(u){
