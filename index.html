<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="googlebot" content="noindex,nofollow">
<title>Atlas · Moderator Onboarding</title>
<style>
:root{
  --accent:#0071e3; --accent-dim:#0058b3; --accent-soft:rgba(0,113,227,0.15); --accent-ink:#4DA3FF;
  --amber:#f59e0b; --amber-bg:#FFF7E6; --amber-text:#7A4A00; --amber-border:#E8C47A;
  --green:#22c55e; --green-bg:#EAF3DE; --green-text:#27500A;
  --red:#ef4444; --red-bg:#FEF2F2; --red-text:#991b1b;
  --blue:#3b82f6; --blue-bg:#EFF6FF; --blue-text:#1e3a8a;
  --font:-apple-system,'SF Pro Display','SF Pro Text',BlinkMacSystemFont,'Helvetica Neue',sans-serif;
  --font-num:'Avenir Next','Avenir','SF Pro Display',-apple-system,sans-serif;
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1218; --bg2:#161B24; --bg3:#1D2430; --bg4:#283141;
  --text:#E8EDF5; --text2:#A3AEC0; --text3:#8693A6;
  --border:#1D2330; --border-strong:#2B3446;
  --input-bg:#161B24; --card-bg:#161B24; --modal-bg:#1A212D;
  --shadow-sm:0 2px 12px rgba(0,0,0,0.50); --shadow-md:0 8px 40px rgba(0,0,0,0.62); --shadow-lg:0 20px 60px rgba(0,0,0,0.72);
  --accent-ink:#4DA3FF; --wash:.16;
}
[data-theme="light"]{
  color-scheme:light;
  --bg:#F3F6FA; --bg2:#FFFFFF; --bg3:#E9EEF5; --bg4:#DCE4EE;
  --text:#0F1A2B; --text2:#475569; --text3:#6B7789;
  --border:rgba(15,30,60,0.10); --border-strong:rgba(15,30,60,0.18);
  --input-bg:#EAF0F7; --card-bg:#FFFFFF; --modal-bg:#FFFFFF;
  --shadow-sm:0 2px 12px rgba(15,30,60,0.06); --shadow-md:0 8px 40px rgba(15,30,60,0.10); --shadow-lg:0 20px 60px rgba(15,30,60,0.14);
  --accent-ink:#0058B0; --wash:.10;
}
*{box-sizing:border-box;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;}input:focus,textarea:focus{outline:none;}
html,body{margin:0;padding:0;}
/* Clean background, same structure in both themes: flat base plus one soft accent wash from the top centre. Static, fixed. */
body{
  font-family:var(--font);color:var(--text);
  background:radial-gradient(1200px 560px at 50% -140px,rgba(0,113,227,var(--wash)) 0%,transparent 72%),var(--bg);
  background-attachment:fixed;
  transition:background .3s,color .3s;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
a{color:var(--accent-ink);}
#login{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(1200px 560px at 50% -140px,rgba(0,113,227,var(--wash)) 0%,transparent 72%),var(--bg);
  background-attachment:fixed;
}
.entry-card{background:var(--card-bg);border:.5px solid var(--border);border-top-color:rgba(0,113,227,0.5);border-radius:22px;box-shadow:var(--shadow-lg);padding:44px 40px 34px;width:100%;max-width:420px;text-align:center;}
.brand-mark{width:50px;height:50px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent-dim));display:flex;align-items:center;justify-content:center;color:#fff;margin:0 auto 14px;box-shadow:0 4px 22px rgba(0,113,227,0.38),0 1px 0 rgba(255,255,255,0.12) inset;}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:10px;}
.entry-title{font-size:25px;font-weight:600;letter-spacing:-.02em;margin-bottom:8px;}
.entry-sub{font-size:14.5px;color:var(--text2);line-height:1.55;margin-bottom:28px;}
.field-label{display:block;text-align:left;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text3);margin-bottom:7px;}
.field-input{width:100%;font-size:15.5px;padding:12px 14px;background:var(--input-bg);border:.5px solid var(--border-strong);border-radius:12px;color:var(--text);letter-spacing:-.005em;transition:border-color .18s,box-shadow .18s;}
.field-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.field-input::placeholder{color:var(--text3);}
textarea.field-input{resize:vertical;min-height:84px;line-height:1.5;}
.err-msg{color:var(--red);font-size:13px;margin-top:10px;min-height:18px;text-align:left;}
.hint-line{font-size:12.5px;color:var(--text3);margin-top:18px;line-height:1.5;}
.version-tag{font-size:10.5px;color:var(--text3);margin-top:22px;opacity:.8;}
.btn{font-size:15px;font-weight:500;letter-spacing:-.01em;padding:11px 16px;border-radius:12px;border:.5px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:all .22s cubic-bezier(.4,0,.2,1);width:100%;}
.btn-primary{background:var(--accent);color:#fff;font-weight:600;}
.btn-primary:hover{background:var(--accent-dim);transform:translateY(-1px);box-shadow:0 6px 18px var(--accent-soft);}
.btn-primary:active{transform:scale(.98);}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none;}
.btn-secondary{background:var(--bg2);color:var(--text);border:.5px solid var(--border-strong);width:auto;}
.btn-secondary:hover{background:var(--bg4);}
.btn-secondary:disabled{opacity:.5;cursor:not-allowed;}
.btn-ghost{background:transparent;color:var(--text2);border:.5px solid var(--border-strong);width:auto;font-size:13px;padding:8px 14px;}
.btn-ghost:hover{background:var(--bg3);color:var(--text);}
.btn-danger{background:transparent;color:var(--red);border:.5px solid var(--border-strong);width:auto;font-size:13px;padding:8px 14px;}
.btn-danger:hover{background:var(--red-bg);}
.btn-sm{font-size:12px;font-weight:500;padding:5px 12px;border-radius:8px;border:.5px solid var(--border-strong);background:var(--bg3);color:var(--accent-ink);cursor:pointer;white-space:nowrap;}
.btn-sm:hover{background:var(--accent);color:#fff;}
.page-wrap{max-width:1180px;margin:0 auto;padding:0 32px;width:100%;}
.shell{min-height:calc(100vh - 40px);}
.demo-bar{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;font-size:12px;color:var(--text2);padding:8px 16px;background:var(--bg2);border-bottom:.5px solid var(--border);text-align:center;}
.demo-bar .dd{width:7px;height:7px;border-radius:50%;background:var(--amber);flex-shrink:0;}
.app-header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:22px 0 18px;flex-wrap:wrap;}
.nav-left{display:flex;align-items:center;gap:12px;min-width:0;}
.nav-logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent-dim));display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;box-shadow:0 2px 8px rgba(0,113,227,0.3);}
.nav-brand{font-size:15.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nav-brand span{color:var(--text3);font-weight:400;}
.nav-right{display:flex;align-items:center;gap:12px;}
.who-text{font-size:13px;line-height:1.4;text-align:right;}
.role-line{color:var(--accent-ink);font-size:11.5px;}
.icon-btn{width:32px;height:32px;border-radius:8px;background:var(--bg3);display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:15px;}
.icon-btn:hover{background:var(--bg4);color:var(--text);}
.btn-signout{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:.5px solid var(--border-strong);color:var(--text2);font-size:12.5px;font-weight:600;}
.btn-signout:hover{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft);}
.nav-tabs{display:flex;gap:6px;background:var(--bg2);border:.5px solid var(--border);border-radius:13px;padding:5px;overflow-x:auto;scrollbar-width:none;box-shadow:var(--shadow-sm);margin-bottom:22px;}
.nav-tabs::-webkit-scrollbar{display:none;}
.nav-tab{display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;padding:9px 16px;border-radius:9px;font-size:13.5px;font-weight:500;color:var(--text2);transition:all .2s;flex:1;min-width:fit-content;}
.nav-tab:hover{color:var(--text);}
.nav-tab.active{background:linear-gradient(135deg,var(--accent),var(--accent-dim));color:#fff;font-weight:600;box-shadow:0 4px 14px var(--accent-soft);}
.content{padding:0 0 60px;min-width:0;overflow-x:hidden;width:100%;}
h1.page-h1{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:0 0 4px;}
.page-sub{font-size:14.5px;color:var(--text2);margin:0 0 24px;line-height:1.5;}
.sec-h{font-size:15px;font-weight:600;letter-spacing:-.01em;margin:26px 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.sec-h .grow{flex:1;}
.card{background:var(--card-bg);border:.5px solid var(--border);border-radius:18px;padding:20px 22px;box-shadow:var(--shadow-sm);}
.hero-box{background:var(--card-bg);border:.5px solid var(--border);border-radius:20px;padding:26px 28px;margin-bottom:26px;box-shadow:var(--shadow-sm);display:flex;gap:24px;align-items:center;}
.hero-box .hero-main{flex:1;min-width:0;}
.hero-box.certified{border-color:rgba(34,197,94,.35);}
.hero-box.locked{border-color:rgba(239,68,68,.4);}
.hero-title2{font-size:19px;font-weight:600;letter-spacing:-.015em;margin-bottom:6px;}
.hero-sub2{font-size:14px;color:var(--text2);line-height:1.5;margin-bottom:16px;}
.ring{position:relative;width:92px;height:92px;flex-shrink:0;}
.ring svg{transform:rotate(-90deg);}
.ring .ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-num);font-size:20px;font-weight:700;}
.progress-track{height:8px;border-radius:99px;background:var(--bg4);overflow:hidden;margin-bottom:8px;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent-dim),var(--accent));border-radius:99px;transition:width .4s cubic-bezier(.4,0,.2,1);}
.progress-label{font-size:12.5px;color:var(--text3);}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:99px;font-size:11.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap;}
.pill-sm{padding:2px 8px;font-size:10.5px;}
.pill-green{background:var(--green-bg);color:var(--green-text);border:.5px solid rgba(34,197,94,.3);}
.pill-amber{background:var(--amber-bg);color:var(--amber-text);border:.5px solid var(--amber-border);}
.pill-blue{background:var(--blue-bg);color:var(--blue-text);border:.5px solid rgba(59,130,246,.3);}
.pill-red{background:var(--red-bg);color:var(--red-text);border:.5px solid rgba(239,68,68,.3);}
.pill-gray{background:var(--bg3);color:var(--text3);border:.5px solid var(--border-strong);}
.stepper{margin-top:6px;}
.step-row{display:flex;gap:14px;position:relative;padding-bottom:22px;}
.step-row:last-child{padding-bottom:0;}
.step-row:not(:last-child)::before{content:'';position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--border);}
.step-dot{width:31px;height:31px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex-shrink:0;background:var(--bg3);color:var(--text3);border:2px solid var(--border-strong);z-index:1;}
.step-dot.locked{opacity:.55;}
.step-dot.current{background:linear-gradient(135deg,var(--accent),var(--accent-dim));color:#fff;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);}
.step-dot.done{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,0.15);}
.step-dot.bad{background:var(--red);color:#fff;border-color:var(--red);}
.step-body{flex:1;padding-top:3px;min-width:0;}
.step-title{font-size:14.5px;font-weight:600;letter-spacing:-.01em;margin-bottom:2px;}
.step-title.locked{color:var(--text3);}
.step-meta{font-size:12px;color:var(--text3);}
.step-row.clickable{cursor:pointer;}
.step-row.clickable:hover .step-title{color:var(--accent-ink);}
.module-page{max-width:760px;margin:0 auto;}
.r-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.r-eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);}
.r-title{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-bottom:6px;}
.r-sub{font-size:14.5px;color:var(--text2);margin-bottom:8px;}
.r-meta{font-size:12.5px;color:var(--text3);margin-bottom:26px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.reader{font-size:15px;line-height:1.72;color:var(--text);}
.reader h2{font-size:17px;font-weight:600;letter-spacing:-.01em;margin:30px 0 12px;}
.reader h3{font-size:14.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--text2);margin:24px 0 10px;}
.reader p{margin:0 0 14px;color:var(--text2);}
.reader ul,.reader ol{margin:0 0 14px;padding-left:22px;color:var(--text2);}
.reader li{margin-bottom:7px;line-height:1.6;color:var(--text2);}
.reader strong{color:var(--text);}
.callout{display:flex;gap:11px;background:var(--bg3);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:13px 16px;margin:16px 0;}
.callout .c-ic{font-size:16px;line-height:1.4;flex-shrink:0;color:var(--accent-ink);}
.callout .c-tx{font-size:14.5px;line-height:1.6;color:var(--text2);}
.callout .c-tx strong{color:var(--text);}
.callout.warn{border-left-color:var(--amber);}.callout.warn .c-ic{color:var(--amber);}
.callout.danger{border-left-color:var(--red);}.callout.danger .c-ic{color:var(--red);}
.callout.info{border-left-color:var(--blue);}.callout.info .c-ic{color:var(--blue);}
.awaiting{display:flex;gap:11px;background:var(--amber-bg);border:1px dashed var(--amber-border);border-radius:12px;padding:14px 16px;margin:16px 0;}
.awaiting .a-ic{font-size:15px;flex-shrink:0;color:var(--amber-text);}
.awaiting .a-tx{font-size:13.5px;line-height:1.6;color:var(--amber-text);}
.awaiting .a-tx strong{font-weight:700;color:var(--amber-text);}
.script{background:var(--bg3);border:.5px solid var(--border);border-radius:12px;padding:14px 16px;font-style:italic;font-size:14.5px;line-height:1.6;color:var(--text2);margin:10px 0;}
.tbl{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px;}
.tbl th{text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);padding:8px 10px;border-bottom:.5px solid var(--border-strong);}
.tbl td{padding:10px 10px;border-bottom:.5px solid var(--border);color:var(--text2);vertical-align:top;}
.video-embed{border-radius:14px;overflow:hidden;border:.5px solid var(--border);margin:14px 0;}
.video-embed iframe{width:100%;aspect-ratio:16/9;border:none;display:block;}
.video-embed video{width:100%;aspect-ratio:16/9;display:block;background:#000;}
.video-fallback{display:flex;align-items:center;justify-content:center;aspect-ratio:16/9;background:var(--bg3);color:var(--text2);font-size:13.5px;flex-direction:column;gap:10px;border:1px dashed var(--border-strong);border-radius:14px;margin:14px 0;text-align:center;padding:16px;}
.quiz-card{background:var(--card-bg);border:.5px solid var(--border);border-radius:16px;padding:22px 24px;margin-top:26px;}
.quiz-progress{font-size:12px;color:var(--text3);margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.quiz-q{font-size:16px;font-weight:600;letter-spacing:-.01em;margin-bottom:16px;line-height:1.45;}
.quiz-opt{display:block;width:100%;text-align:left;padding:13px 15px;border-radius:12px;border:1px solid var(--border-strong);margin-bottom:9px;font-size:14.5px;color:var(--text);background:var(--bg2);transition:all .15s;}
button.quiz-opt:hover{border-color:var(--accent);}
.quiz-opt.picked{border-color:var(--accent);background:var(--accent-soft);}
.quiz-opt.correct{border-color:var(--green);background:var(--green-bg);color:var(--green-text);}
.quiz-opt.incorrect{border-color:var(--red);background:var(--red-bg);color:var(--red-text);}
.quiz-fb{font-size:13.5px;line-height:1.55;margin-top:10px;padding:12px 14px;border-radius:10px;background:var(--bg3);color:var(--text2);font-weight:600;}
.quiz-fb.correct{background:var(--green-bg);color:var(--green-text);}
.quiz-fb.incorrect{background:var(--red-bg);color:var(--red-text);}
.quiz-dots{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.quiz-dot{width:7px;height:11px;border-radius:50%;background:var(--border-strong);transition:all .2s;}
.quiz-dot.active{background:var(--accent);width:22px;height:11px;border-radius:99px;box-shadow:0 0 8px rgba(0,113,227,0.4);}
.quiz-dot.answered{background:var(--accent-dim);opacity:.7;}
.stub-gate{background:var(--card-bg);border:.5px solid var(--border);border-radius:16px;padding:22px 24px;margin-top:26px;}
.mod-nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:26px;gap:10px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--text);color:var(--bg);border-radius:14px;padding:12px 20px;font-size:14px;font-weight:500;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.4,0,.2,1);z-index:1200;max-width:90vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.locked-note{display:flex;align-items:center;gap:10px;background:var(--bg3);border:.5px solid var(--border);border-radius:12px;padding:14px 16px;font-size:13.5px;color:var(--text2);margin-top:14px;}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:99px;background:var(--bg3);border:.5px solid var(--border-strong);font-size:12px;font-weight:600;color:var(--text2);font-family:var(--font-num);white-space:nowrap;}
.chip .cd{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.6s infinite;}
.chip.paused{background:var(--amber-bg);color:var(--amber-text);border-color:var(--amber-border);}
.chip.paused .cd{background:var(--amber);animation:none;}
.chip.blocked{background:var(--red-bg);color:var(--red-text);border-color:rgba(239,68,68,.3);}
.chip.blocked .cd{background:var(--red);animation:none;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
.kpi-card{background:var(--card-bg);border:.5px solid var(--border);border-radius:14px;padding:16px 18px;}
.kpi-val{font-family:var(--font-num);font-size:26px;font-weight:700;}
.kpi-lbl{font-size:11.5px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
.kpi-sub{font-size:11.5px;color:var(--text3);margin-top:3px;}
.filter-row{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.filter-chip{padding:7px 14px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--bg2);border:.5px solid var(--border-strong);color:var(--text2);}
.filter-chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.admin-tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
.admin-tbl{width:100%;border-collapse:collapse;font-size:13.5px;}
.admin-tbl th{text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);padding:10px 12px;border-bottom:.5px solid var(--border-strong);white-space:nowrap;}
.admin-tbl td{padding:12px;border-bottom:.5px solid var(--border);vertical-align:middle;}
.admin-tbl tr:last-child td{border-bottom:none;}
.admin-tbl.dense td{padding:8px 12px;font-size:12.5px;}
.admin-tbl tr.clk{cursor:pointer;}
.admin-tbl tr.clk:hover td{background:var(--bg3);}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap;}
.muted{color:var(--text3);}
.mod-avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex-shrink:0;}
.mod-row-name{display:flex;align-items:center;gap:10px;}
.detail-wrap{max-width:980px;margin:0 auto;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-grid .full{grid-column:1/-1;}
@media (max-width:700px){.grid-2,.form-grid{grid-template-columns:1fr;}}

/* ══════════════════════════════════════════════════════════════════════════
   ATLAS CONTENT BLOCK. EDIT HERE. (Training content lives only in this block.)

   1. Module text: each module below has a  body:  field. Replace the [PLACEHOLDER]

        a) Never type a backtick or the two characters dollar-brace inside body text.
        b) Never type a plain apostrophe ' inside body text. Write &rsquo; instead (don&rsquo;t, moderator&rsquo;s) or put a backslash before it.
           Curly quotes: &ldquo; and &rdquo;. Dash: &ndash;. Double quotes " are fine.
      To write a long body over several lines, end each line with ' and start the next with + ' like this:
        body: '<h2>Heading</h2>'
            + '<p>First paragraph.</p>'
            + '<ul><li>Point one</li><li>Point two</li></ul>',
      Replace the whole  phBody('...')  call with your own string. The comma after the closing quote stays.
   3. Video that plays inside the module (moderators never leave the app): put this in the body, replacing the video placeholder box
        <div class="video-embed"><iframe src="EMBED LINK" title="Video title" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>

      Opening index.html straight from your computer can make some players (YouTube especially) refuse to play. Test videos from the hosted web address.
   4. Knowledge-check questions: each module id has a list in MOD_QUESTIONS_DEFAULT. Replace the

        {q:"Question text", opts:["Option A","Option B","Option C","Option D"], a:2}

        {group:"Tools", kind:"tool", title:"Name shown", desc:"One short line", url:"https://..."}

      The Learning Path, the module count, the total minutes and the admin Curriculum tab all update on their own.
   Anything still showing [PLACEHOLDER] on screen has not been replaced yet.

function phBody(title){
  return '<div class="awaiting"><div class="a-ic">&#9998;</div><div class="a-tx"><strong>[PLACEHOLDER] ' + title + ' content.</strong> Replace this block with the training text for this module.</div></div>'
    + '<h2>[PLACEHOLDER] Section heading</h2>'
    + '<p>[PLACEHOLDER] Paragraph text. Explain the topic in plain language.</p>'
    + '<ul><li>[PLACEHOLDER] Key point one</li><li>[PLACEHOLDER] Key point two</li><li>[PLACEHOLDER] Key point three</li></ul>'
    + '<div class="video-fallback"><div style="font-size:22px">&#9654;</div><div>[PLACEHOLDER] Training video goes here</div></div>'
    + '<div class="callout"><div class="c-ic">&#9432;</div><div class="c-tx"><strong>[PLACEHOLDER] Callout.</strong> Use for a rule or reminder that must not be missed.</div></div>';
}
function phQuestions(n, topic){
  var out = [], letters = ['A','B','C','D'];
  for(var i = 0; i < n; i++){
    var right = i % 4;
    out.push({
      q: '[PLACEHOLDER] Question ' + (i + 1) + ' about ' + topic + '. Replace with the real question.',
      opts: letters.map(function(L, k){ return '[PLACEHOLDER] Answer ' + L + (k === right ? ' (the correct one in this placeholder)' : ''); }),
      a: right
    });
  }
  return out;
}

// Module 1 text, written for moderators: how to use this app. If a button or tab is renamed in the app, update the quoted names below.
// The first paragraph is a placeholder for Ingrid to describe the project itself; the rest is final.
var WELCOME_BODY =
    '<h2>About Project Atlas</h2>'
  + '<p>Atlas is an indoor 3D scanning project. You travel to assigned residential homes and capture spatial and visual data of the interior using a rig of five smartphones recording at the same time. On each floor you walk a slow, continuous loop while all five devices record: once with curtains or blinds open under natural daylight, and once with them closed under indoor lighting. That data trains AI models for indoor scene understanding and 3D floor plan reconstruction.</p>'
  + '<p>You work solo. You are the person who meets the resident at the door, introduces yourself, explains what is going to happen, walks them through the rooms and the scenarios, prepares each floor, runs every scan, enters the metadata, checks your own work, and verifies the upload before you leave. There is no second moderator and no separate QA moderator on Atlas.</p>'
  + '<div class="callout danger"><div class="c-ic">&#9888;</div><div class="c-tx"><strong>No people are ever captured on Atlas.</strong> You are scanning rooms, not people. The resident, anyone else in the home, and all pets stay off the floor you are scanning, for every single walk. If a person or animal enters the floor mid-walk, the walk is void and you re-record it from the start.</div></div>'

const ATLAS_MODULES = [
  {id:'welcome', ic:'&#128075;', title:'Welcome to Atlas', sub:'What Atlas is and how this onboarding works.', min:5, gate:'none', cta:'Mark complete', body: WELCOME_BODY},

      '<p>If a participant asks you who Centific is, this is all you need:</p>'
    + '<div class="script">Centific is a global data and AI company. We collect real-world data so that AI systems learn to understand the world as it actually is, not just textbook examples. The scans we capture today become part of the training material that teaches those systems how real homes are laid out.</div>'

    + '<h2>1. Who is Centific?</h2>'
    + '<p>Centific is a global data and AI solutions company. We do not build the AI products you would recognise by name. We build the data those products learn from, which is why Centific is sometimes described as the hidden infrastructure behind AI models.</p>'
    + '<p>Our clients are companies that build AI systems. They come to us because a model is only as good as the data it learned from, and good data does not exist by default. Someone has to go out and create it, carefully, with real people who agree to take part. That is our job.</p>'
    + '<p>What we provide to those clients:</p>'
    + '<ul>'
    + '<li><strong>Data creation and collection.</strong> Speech, conversation, video, images, spatial and sensor data, and text are all types of data we collect. These are gathered in structured sessions like the ones you will run.</li>'
    + '<li><strong>Human judgment and evaluation.</strong> Experts review, rate, correct and label AI output so systems learn what a good answer looks like and where they get things wrong.</li>'

    + '<div class="callout"><div class="c-ic">&#9432;</div><div class="c-tx"><strong>One rule that never changes.</strong> We never disclose which client a project is for. Not to participants, not to friends, not on social media. That confidentiality is part of the agreement Centific has with every client, and it is part of your agreement with Centific.</div></div>'
    + '<h2>2. What does the data collection team do?</h2>'
    + '<p>The data collection team is the part of Centific that turns a client requirement into a finished, usable dataset. A client says, in effect, our system cannot reliably understand the inside of a real home. The data collection team designs and runs the work that fixes it.</p>'
