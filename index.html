    + '<p style="font-size:14px;color:var(--text2);line-height:1.6;margin:0 0 4px"><strong>What happens next:</strong> contact ' + contactLine() + '. An admin reviews your case and can grant an extra attempt (usually one). It appears here as soon as it is granted.</p></div>';
}

      + '<div class="quiz-card" style="margin-top:12px"><p style="font-size:17px;font-weight:700;color:var(--text);line-height:1.5;margin:0 0 14px">Once you select an answer, it is final. You cannot change it on this or any attempt.</p>'

// Typo-tolerant matching used by moderator search, mileage search and the FAQ page (small edit distance on words of 4+ letters).
function lev(a, b){
  const m = a.length, n = b.length; if(!m) return n; if(!n) return m;
  let prev = [], cur = [];
  for(let j = 0; j <= n; j++) prev[j] = j;
  for(let i = 1; i <= m; i++){
    cur = [i];
    for(let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a.charAt(i-1) === b.charAt(j-1) ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function fuzzyHas(text, tok){
  text = String(text || '').toLowerCase(); tok = String(tok || '').toLowerCase();
  if(!tok) return true; if(text.indexOf(tok) >= 0) return true;
  if(tok.length < 4) return false;
  const lim = tok.length >= 8 ? 2 : 1, words = text.split(/[^a-z0-9]+/);
  for(let i = 0; i < words.length; i++){
    const w = words[i]; if(!w) continue;
    if(Math.abs(w.length - tok.length) <= lim && lev(w, tok) <= lim) return true;
    if(w.length > tok.length && lev(w.slice(0, tok.length), tok) <= lim) return true;
  }
  return false;
}
function fuzzyAll(text, query){ const t = String(query || '').toLowerCase().split(/\s+/).filter(Boolean); return t.every(x => fuzzyHas(text, x)); }

function stageDefs(){
  const n = ATLAS_MODULES.length, a = Math.max(1, Math.floor(n / 3)), b = Math.max(a + 1, Math.floor(2 * n / 3));
  return {a:a, b:b, list:[['none','Not started','#8693A6'],['early','Early (0-' + a + ')','#60a5fa'],['mid','Mid (' + (a + 1) + '-' + b + ')','#3b82f6'],['late','Late (' + (b + 1) + '-' + (n - 1) + ')','#6366f1'],['awaiting','Awaiting final','#f59e0b'],['locked','Locked out','#ef4444'],['certified','Certified','#22c55e']]};
}
function stageOf(c){
  if(c.status === 'certified') return 'certified'; if(c.status === 'locked') return 'locked'; if(c.status === 'awaiting_final') return 'awaiting'; if(c.status === 'not_started') return 'none';
  const d = stageDefs(); return c.doneCount <= d.a ? 'early' : c.doneCount <= d.b ? 'mid' : 'late';
}
function donutSvg(parts, total){
  const r = 62, C = 2 * Math.PI * r; let off = 0, segs = '';
  parts.forEach(p => { if(!p.n) return; const len = C * p.n / total; segs += '<circle cx="80" cy="80" r="62" fill="none" stroke="' + p.color + '" stroke-width="22" stroke-dasharray="' + Math.max(0, len - 2) + ' ' + (C - Math.max(0, len - 2)) + '" stroke-dashoffset="' + (-off) + '"/>'; off += len; });
  return '<svg viewBox="0 0 160 160" class="donut" role="img" aria-label="Status mix"><g transform="rotate(-90 80 80)"><circle cx="80" cy="80" r="62" fill="none" stroke="var(--bg4)" stroke-width="22"/>' + segs + '</g><text x="80" y="82" text-anchor="middle" class="d-n">' + total + '</text><text x="80" y="100" text-anchor="middle" class="d-s">enrolled</text></svg>';
}
function barRow(color, label, n, pct, pctTxt){
  return '<div class="st-row"><span class="st-dot" style="background:' + color + '"></span><span class="st-l">' + esc(label) + '</span><span class="st-n">' + n + '</span><div class="st-bar"><span style="width:' + Math.max(0, Math.min(100, pct)) + '%;background:' + color + '"></span></div><span class="st-p">' + pctTxt + '</span></div>';

    return '<div class="chart-split">' + donutSvg(parts, cs.length) + '<div class="st-list">' + parts.map(p => barRow(p.color, p.label, p.n, p.n / N * 100, Math.round(p.n / N * 100) + '%')).join('') + '</div></div>';

function tipInit(){
  let cur = null; const h = host('tipHost');
  const hide = () => { cur = null; h.innerHTML = ''; };
  document.addEventListener('mouseover', e => {
    const el = e.target.closest ? e.target.closest('[data-tip]') : null;
    if(!el){ if(cur) hide(); return; }
    if(el === cur) return; cur = el;
    h.innerHTML = '<div class="tip" id="tipBox"><b>' + esc(el.getAttribute('data-tip-t') || '') + '</b><span>' + esc(el.getAttribute('data-tip')) + '</span></div>';
    const box = document.getElementById('tipBox'), r = el.getBoundingClientRect();
    let left = r.left + r.width / 2 - box.offsetWidth / 2, top = r.bottom + 8;
    left = Math.max(10, Math.min(left, window.innerWidth - box.offsetWidth - 10));
    if(top + box.offsetHeight > window.innerHeight - 10) top = r.top - box.offsetHeight - 8;
    box.style.left = left + 'px'; box.style.top = top + 'px';
  });
  window.addEventListener('scroll', hide, true); document.addEventListener('mousedown', hide);
}

// ── Randomization engine ──
// Every draw is seeded (moderator email + attempt), so the same attempt always rebuilds the same set. The stored order is saved with each final attempt.
function strHash(s){ let h = 2166136261; for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function shuffleIn(a, r){ for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
// Correct-answer positions: blocks of A,B,C,D in random order, so every position is used evenly and no two neighbours match.
function seqTargets(n, r){
  let seq = [];
  while(seq.length < n){
    const b = shuffleIn([0, 1, 2, 3], r);
    if(seq.length && b[0] === seq[seq.length - 1]){ const t = b[0]; b[0] = b[1]; b[1] = t; }
    seq = seq.concat(b);
  }
  return seq.slice(0, n);
}
function shuffleQ(q, target, r){
  const n = q.opts.length, ci = q.a, others = [];
  for(let i = 0; i < n; i++) if(i !== ci) others.push(i);
  shuffleIn(others, r);
  const ti = target % n, ord = []; let k = 0;
  for(let p = 0; p < n; p++) ord.push(p === ti ? ci : others[k++]);
  return {id:q.id, mod:q.mod, q:q.q, ord:ord, opts:ord.map(i => q.opts[i]), a:ti};
}
function ensureIds(){
  FINAL_CHECK.forEach((q, i) => { if(!q.id) q.id = 'f' + String(i + 1).padStart(3, '0'); });
  Object.keys(MOD_QUESTIONS).forEach(k => MOD_QUESTIONS[k].forEach((q, i) => { if(!q.id) q.id = 'm_' + k + '_' + (i + 1); }));
}
function finalCount(){ const c = (typeof FINAL_QUESTION_COUNT === 'number' && FINAL_QUESTION_COUNT > 0) ? FINAL_QUESTION_COUNT : 40; return Math.min(c, FINAL_CHECK.length); }
function modDraw(modId, email, attempt){
  const list = getModQuestions(modId), r = rng(strHash(email + '|' + modId + '|' + attempt)), t = seqTargets(list.length, r);
  return list.map((q, i) => shuffleQ(q, t[i], r));
}
// Final draw: a fresh random subset and order for every attempt. Questions this moderator has already been asked are only reused when the bank runs out.
function attemptRecord(correct, pct, pass){
  const set = FIN.set;
  return {email:ME.email, attempt:FIN.attempt, at:iso(Date.now()), pct:pct, correct:correct, total:set.length, pass:pass,
    ids:set.map(q => q.id), ord:set.map(q => q.ord), ans:set.map((_, i) => FIN.ans[i] === undefined ? -1 : FIN.ans[i])};
}
function setFromRecord(s){
  const out = [];
  for(let i = 0; i < s.ids.length; i++){
    const b = FINAL_CHECK.find(x => x.id === s.ids[i]); if(!b) return null;
    const ord = s.ord[i]; out.push({id:b.id, mod:b.mod, q:b.q, ord:ord, opts:ord.map(k => b.opts[k]), a:ord.indexOf(b.a)});
  }
  return out;
}

// ── v0.3.3: topic-stratified final draw ──
function topicMin(){ return (typeof FINAL_MIN_PER_TOPIC === 'number' && FINAL_MIN_PER_TOPIC >= 0) ? FINAL_MIN_PER_TOPIC : 3; }
function topicCap(cnt){ const p = (typeof FINAL_MAX_TOPIC_PCT === 'number' && FINAL_MAX_TOPIC_PCT > 0) ? FINAL_MAX_TOPIC_PCT : 25; return Math.max(topicMin(), Math.ceil(cnt * p / 100)); }
function topicSizes(){ const g = {}; FINAL_CHECK.forEach(q => { const k = q.mod || 'general'; g[k] = (g[k] || 0) + 1; }); return g; }
// How many questions each topic contributes to an attempt: [min, max]
function topicPlan(){
  const cnt = finalCount(), g = topicSizes(), cap = topicCap(cnt), mn = topicMin();
  return {cnt:cnt, cap:cap, rows:Object.keys(g).map(k => ({id:k, n:g[k], min:Math.min(mn, g[k], cap), max:Math.min(g[k], cap)}))};
}
function finalDraw(email){
  const bank = FINAL_CHECK, cnt = finalCount();
  const started = new Set(ROWS.filter(r => r.StaffId === email && r.Type === 'final').map(r => r.SegmentId)).size;
  const r = rng(strHash(email + '|final|' + started + '|' + bank.length));
  const seen = new Set(); ATTSETS.filter(s => s.email === email).forEach(s => s.ids.forEach(id => seen.add(id)));
  const g = {};
  bank.forEach(q => { const k = q.mod || 'general'; g[k] = g[k] || {f:[], u:[]}; (seen.has(q.id) ? g[k].u : g[k].f).push(q); });
  const keys = Object.keys(g); keys.forEach(k => { shuffleIn(g[k].f, r); shuffleIn(g[k].u, r); });
  const size = k => g[k].f.length + g[k].u.length, cap = topicCap(cnt), mn = topicMin(), take = {};
  let sum = 0; keys.forEach(k => { take[k] = Math.min(mn, size(k), cap); sum += take[k]; });
  while(sum > cnt){ const k = keys.slice().sort((a, b) => take[b] - take[a])[0]; take[k]--; sum--; }
  while(sum < cnt){
    let c = keys.filter(k => take[k] < size(k) && take[k] < cap); if(!c.length) c = keys.filter(k => take[k] < size(k)); if(!c.length) break;
    const w = c.map(k => (size(k) - take[k]) + 2 * Math.max(0, g[k].f.length - take[k])), tot = w.reduce((a, b) => a + b, 0);
    let x = r() * tot, i = 0; while(i < c.length - 1 && x >= w[i]){ x -= w[i]; i++; }
    take[c[i]]++; sum++;
  }
  let pick = []; keys.forEach(k => { pick = pick.concat(g[k].f.concat(g[k].u).slice(0, take[k])); });
  shuffleIn(pick, r); const t = seqTargets(pick.length, r);
  return pick.map((q, i) => shuffleQ(q, t[i], r));
}

let SIDX = null, SRC = [], SRSEL = 0;
function srKbd(){ return /Mac|iPhone|iPad/i.test(navigator.platform || '') ? '&#8984;K' : 'Ctrl K'; }
function sIndex(){
  if(SIDX) return SIDX;
  SIDX = [];
  ATLAS_MODULES.forEach((m, mi) => {
    const doc = new DOMParser().parseFromString('<div>' + m.body + '</div>', 'text/html'), root = doc.body.firstChild;
    root.querySelectorAll('li,p,div,h1,h2,h3,td,th,tr,span').forEach(e => e.appendChild(doc.createTextNode(' ')));
    let cur = {h:m.title, text:''};
    const push = () => { const t = cur.text.replace(/\s+/g, ' ').trim(); if(t) SIDX.push({mi:mi, mid:m.id, mtitle:m.title, ic:m.ic, h:cur.h.replace(/\s+/g, ' ').trim(), text:t}); };
    root.childNodes.forEach(n => { if(n.nodeName === 'H2'){ push(); cur = {h:n.textContent, text:''}; } else cur.text += ' ' + n.textContent; });
    push();
  });
  return SIDX;
}
// first place a token appears: exact, else a close (typo) word
function sFind(text, tok){
  const low = text.toLowerCase(), i = low.indexOf(tok); if(i >= 0) return {i:i, n:tok.length};
  if(tok.length < 4) return null;
  const re = /[a-z0-9]+/gi; let m;
  while((m = re.exec(text))){ if(fuzzyHas(m[0], tok) && Math.abs(m[0].length - tok.length) <= 2) return {i:m.index, n:m[0].length}; }
  return null;
}
function sSnippet(text, toks){
  const hits = toks.map(t => sFind(text, t)).filter(Boolean);
  const first = hits.length ? Math.min.apply(null, hits.map(h => h.i)) : 0, start = Math.max(0, first - 55), end = Math.min(text.length, start + 170);
  const seg = text.slice(start, end), rel = hits.map(h => ({i:h.i - start, n:h.n})).filter(h => h.i >= 0 && h.i < seg.length).sort((a, b) => a.i - b.i);
  let out = '', p = 0; rel.forEach(h => { if(h.i < p) return; out += esc(seg.slice(p, h.i)) + '<mark>' + esc(seg.slice(h.i, h.i + h.n)) + '</mark>'; p = h.i + h.n; });
  return (start > 0 ? '&hellip; ' : '') + out + esc(seg.slice(p)) + (end < text.length ? ' &hellip;' : '');
}
function sScore(h, text, toks, q){
  const hl = h.toLowerCase(), tl = text.toLowerCase(); let s = hl.indexOf(q.toLowerCase()) >= 0 ? 50 : 0;
  toks.forEach(t => { if(hl.indexOf(t) >= 0) s += 10; s += Math.min(10, tl.split(t).length - 1); });
  return s;
}
function sAll(){ return ROLE === 'admin' || computeUser(ME.email).allDone; }
function sSearch(q){
  const toks = q.toLowerCase().split(/\s+/).filter(Boolean), u = ROLE === 'admin' ? null : computeUser(ME.email), all = sAll();
  const out = {mods:[], locked:{}, res:[], faq:[], faqLocked:false, toks:toks};
  sIndex().forEach(s => {
    if(!fuzzyAll(s.h + ' ' + s.text, q)) return;
    if(all || u.done.has(s.mid)) out.mods.push({s:s, sc:sScore(s.h, s.text, toks, q)});
    else { out.locked[s.mid] = out.locked[s.mid] || {title:s.mtitle, ic:s.ic, n:0}; out.locked[s.mid].n++; }
  });

  (typeof RESOURCES !== 'undefined' ? RESOURCES : []).forEach(r => { const t = r.title + ' ' + (r.desc || '') + ' ' + (r.group || ''); if(fuzzyAll(t, q)) out.res.push({r:r, sc:sScore(r.title, t, toks, q)}); });

  out.faq.sort((a, b) => b.sc - a.sc);
  return out;
}

    ['left','pill-gray','The moderator navigated away from the module, or finished reading and went back (review).'],

  {h:'Visit and closure', where:'Details page: Full segment history', rows:[
    ['initial','pill-gray','First pass through a module. Counts toward paid time.'],
    ['review','pill-blue','Time in a module after it was already completed. Counts toward paid time only if the Paid-Hours Setting says so.'],
    ['clean','pill-gray','The segment was saved normally.'],

  {h:'Validation flags', where:'Dashboard (count) and Details page (each flag)', rows:[

];
const GUIDE_KEY = [['pill-green','Done or good'],['pill-blue','In progress or info'],['pill-amber','Needs a look'],['pill-red','Action needed'],['pill-gray','Neutral']];
function openGuide(){

  const body = GUIDE.map(g => '<section class="gl-sec"><div class="gl-sec-h"><h4>' + esc(g.h) + '</h4><span class="gl-count">' + g.rows.length + '</span><span class="gl-where">' + esc(g.where) + '</span></div>'
    + g.rows.map(r => '<div class="gl-row"><span class="gl-k"><span class="pill ' + r[1] + '">' + esc(r[0]) + '</span></span><span class="gl-v">' + esc(r[2]) + '</span></div>').join('') + '</section>').join('');
  openModal('<div class="gl-head"><div style="flex:1;min-width:0"><h3>Statuses &amp; flags</h3><p>What each status and validation flag means on the admin screens. Colours match what you see in the app.</p></div><button class="icon-btn" onclick="closeModal()" aria-label="Close">&#10005;</button></div>'
    + key + '<div class="gl-body">' + body + '</div>');

const STATUS_PILL = {not_started:['pill-gray','Not started'], in_progress:['pill-blue','In progress'], awaiting_final:['pill-amber','Awaiting final'], locked:['pill-red','Locked out'], certified:['pill-green','Certified']};
function mods(){ return DIR.filter(r => r.role === 'moderator'); }
function togglePaid(){ Store.setSetting('reviewPaid', !SETTINGS.reviewPaid).then(async () => { SETTINGS = await Store.getSettings(); renderView(); toast('Paid-Hours Setting: review time ' + (SETTINGS.reviewPaid ? 'counts' : 'does not count')); }); }
function paidCard(){
  return '<div class="card" style="margin-bottom:18px"><div class="toggle-row"><button class="switch' + (SETTINGS.reviewPaid ? ' on' : '') + '" role="switch" aria-checked="' + !!SETTINGS.reviewPaid + '" aria-label="Review time counts toward paid hours" onclick="togglePaid()"></button>'
    + '<div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14.5px">Paid-Hours Setting: review time ' + (SETTINGS.reviewPaid ? 'counts toward paid hours' : 'does not count toward paid hours') + '</div>'
    + '<div class="muted" style="font-size:12.5px;margin-top:2px">Project-wide setting. Initial module time and final assessment time always count. Both totals are shown on each moderator.</div></div></div></div>';
}
async function adminRefresh(){ await Store.recoverStale(SESSION_ID); await refreshAll(); renderView(); toast('Refreshed.'); }
function openDetail(email, from){ UI.dopen = {}; detailEmail = email; detailFrom = from || 'dash'; VIEW = 'detail'; renderNavTabs(); renderView(); window.scrollTo(0,0); }
function csvForUser(email){
  const u = computeUser(email), rows = [ROW_COLS.concat(['Flags'])];
  u.all.forEach(r => rows.push(ROW_COLS.map(c => r[c]).concat([(u.flagsByRow[r.SegmentId]||[]).join('; ')])));
  return rows;
}
function exportUser(email){ downloadCSV('atlas_' + email.split('@')[0] + '_segments.csv', csvForUser(email)); }
function exportAll(){
  let rows = [['Moderator'].concat(ROW_COLS, ['Flags'])];
  mods().forEach(m => { csvForUser(m.email).slice(1).forEach(r => rows.push([m.name].concat(r))); });
  downloadCSV('atlas_all_segments.csv', rows);
}

// ── ADMIN: MODERATOR DETAIL (per-moderator Details page) ──────────────────────
function flagPills(arr){ return arr.length ? '<div class="flag-list">' + arr.map(f => '<span class="pill pill-amber pill-sm"' + tipAttr('flag', f) + '>' + f + '</span>').join('') + '</div>' : ''; }
function openGrant(email){
  const rec = DIR.find(r => r.email === email);
  openModal('<h3>Grant extra attempts</h3><p>Add final-assessment attempts for ' + esc(rec ? rec.name : email) + '. This is saved as an audit row with your name on it.</p><label class="field-label" for="grantN">Extra attempts</label><input class="field-input" id="grantN" type="number" min="1" max="5" value="1"><div class="m-actions"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="doGrant(\'' + esc(email) + '\')">Grant</button></div>');
}
async function doGrant(email){
  const n = Math.max(1, Math.min(5, parseInt(document.getElementById('grantN').value, 10) || 1));
  await Store.grantAttempts(email, n, ME.email); closeModal(); await refreshAll(); renderView(); toast('Granted ' + n + ' extra attempt' + (n>1?'s':'') + '.');
}

// ── ADMIN: CURRICULUM (read-only view; click a module to see its content and questions; content is edited in the content block of the file) ──
const curSets = {}, curIdx = {};
function curQBody(key){
  const qs = curSets[key], n = qs.length;
  const i = Math.max(0, Math.min(n - 1, curIdx[key] || 0)); curIdx[key] = i;
  const q = qs[i];
  return '<div class="cur-flip-h"><span class="cur-flip-n">Question ' + (i+1) + ' of ' + n + '</span><span class="cur-flip-bar"><span style="width:' + Math.round((i+1)/n*100) + '%"></span></span></div>'
    + '<div class="cur-q"><div class="cur-q-t">' + esc(q.q) + '</div>'
    + q.opts.map((o, oi) => '<div class="cur-opt' + (oi === q.a ? ' ok' : '') + '"><span class="l">' + 'ABCD'.charAt(oi) + '</span><span>' + esc(o) + (oi === q.a ? ' <strong>&#10003; Correct answer</strong>' : '') + '</span></div>').join('') + '</div>'
    + '<div class="cur-flip-nav"><button class="btn btn-ghost" onclick="curFlip(\'' + key + '\',-1)"' + (i === 0 ? ' disabled' : '') + '>&larr; Previous</button>'
    + '<button class="btn btn-ghost" onclick="curFlip(\'' + key + '\',1)"' + (i === n - 1 ? ' disabled' : '') + '>Next &rarr;</button></div>';
}
function curQuestionsHtml(qs, key){
  curSets[key] = qs;
  return '<div class="cur-flip" id="cq-' + key + '">' + curQBody(key) + '</div>';
}
function curFlip(key, d){
  curIdx[key] = (curIdx[key] || 0) + d;
  const h = document.getElementById('cq-' + key); if(h) h.innerHTML = curQBody(key);
}
function curCard(key, icon, title, meta, pillHtml, bodyHtml){
  const open = !!curOpen[key];
  return '<div class="card cur-card' + (open ? ' open' : '') + '"><button class="cur-head" onclick="toggleCur(\'' + key + '\')" aria-expanded="' + open + '">'
    + '<span class="cur-chev" aria-hidden="true">&#9654;</span>'
    + '<span class="cur-t"><span style="display:block;font-weight:600">' + icon + ' ' + title + '</span><span class="muted" style="display:block;font-size:12.5px">' + meta + '</span></span>' + pillHtml + '</button>'
    + (open ? '<div class="cur-body">' + bodyHtml + '</div>' : '') + '</div>';
}
function vCurriculum(){
  const phCount = arr => arr.filter(q => String(q.q).indexOf('[PLACEHOLDER]') >= 0).length;
  // Content state: none open = Content added; a few open items inside real content = Partly developed; mostly untouched = Placeholder content
  const phIn = s => (String(s).match(/\[PLACEHOLDER\]/g) || []).length;
  const phState = (body, qs) => {
    const n = phIn(body) + phCount(qs), allQ = qs.length > 0 && phCount(qs) === qs.length;
    if(!n) return {k:'done', n:0};
    return {k: (phIn(body) >= 3 || allQ) ? 'ph' : 'part', n:n};
  };
  const phPill = st => st.k === 'done' ? '<span class="pill pill-green pill-sm">Content added</span>'
    : st.k === 'part' ? '<span class="pill pill-blue pill-sm" title="Content added, with ' + st.n + ' open item' + (st.n > 1 ? 's' : '') + ' still to confirm">Partly developed</span>'
    : '<span class="pill pill-amber pill-sm">Placeholder content</span>';
  const rows = ATLAS_MODULES.map((m, i) => {
    const qs = getModQuestions(m.id), ph = phState(m.body, qs);
    const meta = '~' + m.min + ' min &middot; ' + (m.gate === 'check' ? qs.length + ' check questions' : 'no check, "' + esc(m.cta || 'Mark complete') + '"');
    const body = '<div class="cur-sec">Module content</div><div class="cur-content reader">' + m.body + '</div>'
      + (qs.length ? '<div class="cur-sec">Knowledge check &middot; ' + qs.length + ' questions</div>' + curQuestionsHtml(qs, m.id)
        : '<div class="cur-sec">Knowledge check</div><div class="muted" style="font-size:13.5px">None. Moderators press "' + esc(m.cta || 'Mark complete') + '" to finish this module.</div>');
    return curCard(m.id, m.ic, (i+1) + '. ' + esc(m.title), meta, phPill(ph), body);
  }).join('');
  const fbody = bankBodyHtml();
  const fcard = curCard('final', '&#127919;', 'Final assessment question bank', FINAL_CHECK.length + ' questions &middot; ' + finalCount() + ' drawn per attempt &middot; ' + FINAL_PASS_PCT + '% to pass &middot; ' + FINAL_MAX_ATTEMPTS + ' attempts, then lockout; admin can grant more', phPill(phState('', FINAL_CHECK)), fbody);
  return '<h1 class="page-h1">Curriculum</h1><p class="page-sub">' + ATLAS_MODULES.length + ' modules in locked order, then the final assessment. Click a module to see what moderators see, with its questions and answer choices to flip through. Module and question content is read-only here. The FAQ editor is at the top.</p>'
    + faqEditorHtml() + '<div class="cur-tools"><button class="btn btn-ghost" onclick="curAll(true)">Expand all</button><button class="btn btn-ghost" onclick="curAll(false)">Collapse all</button></div>' + rows + fcard;
}
function toggleCur(k){ curOpen[k] = !curOpen[k]; renderView(); }
function curAll(open){ ATLAS_MODULES.forEach(m => { curOpen[m.id] = open; }); curOpen.final = open; renderView(); }

// ── ADMIN: MODERATORS ────────────────────────────────────────────────────────
async function addMod(){
  const n = document.getElementById('nmName').value.trim(), e = document.getElementById('nmEmail').value.trim().toLowerCase(), c = document.getElementById('nmCohort').value.trim();
  const err = document.getElementById('nmErr');
  if(!n){ err.textContent = 'Enter a name.'; return; }
  if(!/^[^@\s]+@centific\.com$/.test(e)){ err.textContent = 'Use an @centific.com email.'; return; }
  if(DIR.some(d => d.email === e)){ err.textContent = 'That email is already in the list.'; return; }
  DIR.push({name:n, email:e, role:'moderator', cohort:c, active:'yes'}); await Store.saveUsers(DIR); renderView(); toast('Moderator added.');
}
async function setActive(email, v){
  const d = DIR.find(x => x.email === email); if(!d) return;
  if(v === 'no' && !(await askConfirm('Deactivate ' + d.name + '?', 'They will no longer be able to sign in. Their history is kept.', 'Deactivate'))) return;
  d.active = v; await Store.saveUsers(DIR); renderView();
}

// ── DEMO CONTROLS DRAWER ─────────────────────────────────────────────────────
function openDemo(){
  const st = Store.failures;
  document.getElementById('overlays').innerHTML = '<div class="overlay" style="padding:0;justify-content:flex-end;align-items:stretch" onclick="if(event.target===this)closeModal()"><div class="drawer">'
    + '<div style="display:flex;align-items:center;gap:10px"><h3 style="flex:1">Demo controls</h3><button class="icon-btn" onclick="closeModal()" aria-label="Close">&#10005;</button></div>'
    + '<div class="muted" style="font-size:12.5px;margin-bottom:6px">For demos only. Not part of the real app.</div>'
    + '<div class="d-sec"><h4>Run the test automatically</h4><button class="btn btn-primary" onclick="demoAutoFinal(true)">Take the final automatically: PASS</button><button class="btn btn-secondary" onclick="demoAutoFinal(false)">Take the final automatically: FAIL</button>'
    + '<div class="muted" style="font-size:12px;line-height:1.5">Sign in as test.mod first. Modules are completed for you, then the final is taken on screen. PASS answers everything correctly. FAIL scores 55% and uses one attempt (three fails lock the moderator out). Use Reset demo data between runs.</div></div>'
    + '<div class="d-sec"><h4>Timers (seconds)</h4>'
    + '<div class="d-row"><label for="cfgIdle">"Still there?" after</label><input class="field-input" id="cfgIdle" type="number" min="3" value="' + CFG.idleAfter + '"></div>'
    + '<div class="d-row"><label for="cfgWait">Pause if no answer after</label><input class="field-input" id="cfgWait" type="number" min="3" value="' + CFG.promptWait + '"></div>'
    + '<div class="d-row"><label for="cfgHb">Checkpoint every</label><input class="field-input" id="cfgHb" type="number" min="3" value="' + CFG.hb + '"></div>'
    + '<button class="btn btn-secondary" onclick="applyCfg()">Apply</button><button class="btn btn-secondary" onclick="fastCfg()">Fast demo preset (10 / 10 / 10)</button><button class="btn btn-ghost" onclick="defaultCfg()">Back to defaults (180 / 120 / 120)</button></div>'
    + '<div class="d-sec"><h4>Time-tracking scenarios</h4>'
    + '<button class="btn btn-secondary" onclick="demoClose(true)">Simulate browser closed mid-module</button>'
    + '<button class="btn btn-secondary" onclick="demoClose(false)">Simulate crash (no closing checkpoint)</button>'
    + '<button class="btn btn-secondary" onclick="demoSweep()">Run recovery cleanup now</button>'
    + '<button class="btn btn-secondary" onclick="demoFail()">Fail the next 3 saves (held and re-sent)' + (st ? ' [' + st + ' pending]' : '') + '</button>'
    + '<div class="muted" style="font-size:12px;line-height:1.5">Close and crash end the session without a clean save. Sign in again as the same moderator: the open segment is closed as "recovered" and shows in the admin view.</div></div>'
    + '<div class="d-sec"><h4>Moderator state</h4>'
    + '<button class="btn btn-secondary" onclick="demoComplete()">Complete all modules (no time added)</button>'
    + '<button class="btn btn-secondary" onclick="demoLockout()">Jump to final lockout</button>'
    + '<div class="muted" style="font-size:12px;line-height:1.5">Applies to the signed-in moderator, or to test.mod when signed in as admin.</div></div>'
    + '<div class="d-sec"><h4>Live clock</h4><div class="live-box" id="demoLive"></div></div>'
    + '<div class="d-sec"><h4>Data</h4><button class="btn btn-danger" onclick="demoReset()">Reset demo data</button></div></div></div>';
  updateDemoLive();
}
function updateDemoLive(){
  const el = document.getElementById('demoLive'); if(!el) return;
  const s = Clock.seg;
  el.innerHTML = s ? ('State: <strong>' + Clock.state + '</strong><br>Segment: ' + esc(s.module) + ' / ' + s.type + ' #' + s.attempt + ' (' + s.visit + ')<br>Active: ' + Clock.shown() + 's &middot; Idle: ' + s.idle + 's &middot; Quiet: ' + Clock.quiet + 's<br>Checkpoints sent: ' + Clock.hbCount + ' &middot; next at active ' + Clock.nextBeat + 's<br>Thresholds: ' + CFG.idleAfter + ' / ' + CFG.promptWait + ' / ' + CFG.hb) : ('No segment running.<br>Thresholds: ' + CFG.idleAfter + ' / ' + CFG.promptWait + ' / ' + CFG.hb);
}
function applyCfg(){
  const g = id => Math.max(3, parseInt(document.getElementById(id).value, 10) || 3);
  CFG.idleAfter = g('cfgIdle'); CFG.promptWait = g('cfgWait'); CFG.hb = g('cfgHb');
  if(Clock.seg) Clock.nextBeat = Clock.seg.active + CFG.hb; toast('Timers applied.'); updateDemoLive();
}
function fastCfg(){ CFG = {idleAfter:10, promptWait:10, hb:10}; if(Clock.seg) Clock.nextBeat = Clock.seg.active + 10; openDemo(); toast('Fast demo timers on.'); }
function defaultCfg(){ CFG = Object.assign({}, CFG_DEFAULT); openDemo(); toast('Default timers restored.'); }
function demoClose(clean){
  if(!Clock.simulateClose(clean)){ toast('No timed segment is running. Open a module as a moderator first.'); return; }
  closeModal(); ME = null; ROLE = null; renderLogin();
  toast(clean ? 'Simulated: browser closed. Sign in again to see the recovered segment.' : 'Simulated: crash. Sign in again to see the recovered segment.');
}
async function demoSweep(){ const n = await Store.recoverStale(SESSION_ID); await refreshAll(); if(ROLE) renderView(); toast(n ? n + ' stale segment' + (n>1?'s':'') + ' recovered.' : 'Nothing stale to recover.'); }
function demoFail(){ Store.failures = 3; openDemo(); toast('The next 3 saves will fail, then re-send on next open.'); }
function demoTarget(){ return (ME && ME.role === 'moderator') ? ME.email : 'test.mod@centific.com'; }
async function demoFillModules(email){
  await refreshAll(); const u = computeUser(email), t = iso(Date.now());
  for(const m of ATLAS_MODULES){ if(u.done.has(m.id)) continue; await Store.saveRow(mkRow({email, module:m.id, type:m.gate==='check'?'quiz':'module', attempt:1, score:m.gate==='check'?100:'', dur:0, idle:0, start:t, end:t, seg:uid('seed-demo-'), status:'completed'})); }
}
async function demoComplete(){
  const email = demoTarget(); await leaveSegment(); await demoFillModules(email); await refreshAll();
  closeModal(); if(ROLE === 'moderator'){ VIEW = 'path'; renderNavTabs(); } renderView(); toast('All modules marked complete for ' + email + '.');
}
async function demoLockout(){
  const email = demoTarget(); await leaveSegment(); await demoFillModules(email); await refreshAll();
  let u = computeUser(email), t = iso(Date.now());
  while(u.used < u.allowance && !u.passedRow){
    await Store.saveRow(mkRow({email, module:'final', type:'final', attempt:u.used+1, score:55, dur:600, idle:0, start:t, end:t, seg:uid('seed-demo-'), status:'failed'}));
    await refreshAll(); u = computeUser(email);
  }
  closeModal(); if(ROLE === 'moderator'){ VIEW = 'path'; renderNavTabs(); FIN = {mode:'idle', idx:0, ans:{}, result:null}; } renderView(); toast('Final assessment locked out for ' + email + '.');
}
async function demoReset(){
  if(!(await askConfirm('Reset demo data?', 'This restores the seeded history and clears everything entered in this browser.', 'Reset'))) return;
  await leaveSegment(); await Store.reset(); await refreshAll();
  ME = null; ROLE = null; closeModal(); renderLogin(); toast('Demo data reset.');
}

// ── BOOT ─────────────────────────────────────────────────────────────────────
(async function boot(){
  if(window.ATLAS_CONTENT_MISSING) return;   // split mode: the content file did not load; the page already shows a clear message
  try{ const th = localStorage.getItem('atlas_theme'); if(th) document.documentElement.setAttribute('data-theme', th); }catch(e){}
  syncDB(); await refreshAll();
  await Store.recoverStale(SESSION_ID); await flushOutbox();
  ensureIds(); Clock.init(); tipInit();
  window.addEventListener('scroll', e => { if(UI.pop && !(e.target && e.target.closest && e.target.closest('#popBox'))) popClose(); }, true);
  window.addEventListener('resize', () => { if(UI.pop) popClose(); });
  document.addEventListener('keydown', e => { if(e.key === 'Escape' && UI.pop) popClose(); });
  renderLogin();
  // scheduled cleanup stand-in + admin auto-refresh + held-save retry
  setInterval(async () => {
    const n = await Store.recoverStale(SESSION_ID);
    await flushOutbox();
    if(ROLE === 'admin' && (VIEW === 'dash' || VIEW === 'detail') && !document.querySelector('#overlays .overlay') && !UI.pop){ await refreshAll(); renderView(); }
    else if(n){ await refreshAll(); }
  }, 15000);
})();
